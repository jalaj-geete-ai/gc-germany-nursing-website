<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!--
  OG SHARE-CARD GENERATOR (1200x630).
  Render to og-image.jpg, then host it at https://globalcareers.testbook.com/og-image.jpg
  (the URL that index.html's og:image / twitter:image already reference).
  Export with headless Chrome:
    "chrome" --headless=new --force-device-scale-factor=2 --window-size=1200,630 \
      --screenshot=og-image.png http://localhost:5173/og.html
    sips -s format jpeg -s formatOptions 90 og-image.png --out og-image.jpg
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..800&family=Inter:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: linear-gradient(150deg, #14B8DD 0%, #0A7DA0 42%, #0E1620 105%);
    font-family: 'Inter', sans-serif; color: #fff;
    padding: 68px 72px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .glow { position: absolute; width: 560px; height: 560px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.16), transparent 60%);
    right: -140px; top: -160px; }
  .top { display: flex; align-items: center; gap: 16px; position: relative; z-index: 2; }
  .flag { width: 46px; height: 31px; border-radius: 5px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.25); display: flex; flex-direction: column; }
  .flag i { flex: 1; } .flag .k { background: #000; } .flag .r { background: #D00; } .flag .g { background: #FFCE00; }
  .brand { font-family: 'IBM Plex Mono', monospace; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; opacity: .95; }
  .mid { position: relative; z-index: 2; }
  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 18px; letter-spacing: .16em; text-transform: uppercase; color: #E4F8FC; opacity: .85; margin-bottom: 18px; }
  h1 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 74px; line-height: 1.02; letter-spacing: -0.01em; max-width: 900px; }
  h1 span { color: #FFCE00; }
  .chips { display: flex; gap: 14px; position: relative; z-index: 2; }
  .chip { background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.28); border-radius: 100px; padding: 13px 24px; font-size: 22px; font-weight: 600; backdrop-filter: blur(2px); }
  .chip b { font-family: 'Fraunces', serif; font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="top">
      <div class="flag"><i class="k"></i><i class="r"></i><i class="g"></i></div>
      <div class="brand">Global Careers &nbsp;·&nbsp; by Testbook</div>
    </div>
    <div class="mid">
      <div class="eyebrow">Germany Nursing Program</div>
      <h1>Build your nursing career in <span>Germany</span></h1>
    </div>
    <div class="chips">
      <div class="chip"><b>300+</b> placements</div>
      <div class="chip"><b>95%</b> visa success</div>
      <div class="chip">Salary from <b>€2,800</b>/mo</div>
    </div>
  </div>
</body>
</html>
