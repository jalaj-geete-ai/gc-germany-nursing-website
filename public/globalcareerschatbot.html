<style>
  :root{
    --ink:#0B1F3A;
    --cyan:#14B8DD;
    --indigo:#5B6EF5;
    --green:#0E9F6E;
    --canvas:#EEF1F6;
    --line:#E4E9F2;
    --warn:#E5484D;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    color:#132038;
    min-height:100dvh;
    background:
      radial-gradient(1200px 600px at 50% -10%, #dfe6f3 0%, rgba(223,230,243,0) 60%),
      linear-gradient(180deg,#c9d2e4 0%,#aeb9d2 100%);
    display:flex; align-items:flex-start; justify-content:center;
  }
  @media (min-width:640px){ body{ padding:24px; } }

  .phone{
    width:100%; max-width:430px; display:flex; flex-direction:column;
    background:#fff; height:100dvh; max-height:820px; overflow:hidden; position:relative;
  }
  @media (min-width:640px){
    .phone{ border-radius:26px; box-shadow:0 30px 80px -20px rgba(11,31,58,.45), 0 0 0 1px rgba(11,31,58,.06); }
  }

  /* header */
  .hdr{ background:var(--ink); color:#fff; padding:7px 14px 6px; }
  .hdr-top{ display:flex; align-items:center; gap:10px; }
  .avatar{ width:36px; height:36px; border-radius:50%; flex:0 0 auto; overflow:hidden; box-shadow:0 0 0 2px rgba(255,255,255,.15); }
  .avatar svg{ display:block; width:100%; height:100%; }
  .avatar .face, .mini .face{ width:100%; height:100%; object-fit:cover; object-position:center 38%; display:block; }
  .hdr h1{ font-size:14.5px; font-weight:700; margin:0; line-height:1.1; display:flex; align-items:center; gap:5px; }
  .tick{ width:13px; height:13px; }
  .hdr .sub{ font-size:10.5px; color:rgba(255,255,255,.72); margin-top:1px; display:flex; align-items:center; gap:5px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:#34d399; box-shadow:0 0 0 0 rgba(52,211,153,.6); animation:pulse 2s infinite; flex:0 0 auto; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)} 70%{box-shadow:0 0 0 7px rgba(52,211,153,0)} 100%{box-shadow:0 0 0 0 rgba(52,211,153,0)} }
  .badges{ display:flex; gap:12px; padding:5px 2px 1px; font-size:10px; color:rgba(255,255,255,.85); }
  .badges b{ color:#fff; }

  .mini svg{ display:block; width:100%; height:100%; }
  .bubble{
    max-width:85%; padding:8px 12px; font-size:13.5px; line-height:1.4;
    border-radius:15px; box-shadow:0 1px 1px rgba(11,31,58,.06);
    animation:pop .28s cubic-bezier(.2,.7,.3,1.2) both; word-wrap:break-word; white-space:pre-wrap;
  }

  .bubble.user{ background:var(--indigo); color:#fff; border-bottom-right-radius:5px; }
  @keyframes pop{ from{ opacity:0; transform:translateY(6px) scale(.98);} to{ opacity:1; transform:none;} }

  .typing{ display:inline-flex; gap:4px; align-items:center; padding:12px 14px; }
  .typing span{ width:7px; height:7px; border-radius:50%; background:#9fb0c9; animation:blink 1.3s infinite both; }
  .typing span:nth-child(2){ animation-delay:.2s; } .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,60%,100%{ opacity:.25; transform:translateY(0);} 30%{ opacity:1; transform:translateY(-2px);} }

  /* salary card */
  .card{ max-width:86%; width:100%; background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:0 1px 1px rgba(11,31,58,.06); animation:pop .3s both; }
  .card-h{ background:var(--ink); color:#fff; font-size:13px; font-weight:600; padding:9px 14px; }
  .card-grid{ display:grid; grid-template-columns:1fr 1fr; }
  .card-col{ padding:14px; text-align:center; }
  .card-col.br{ border-right:1px solid #EDF1F7; }
  .card-col .lbl{ font-size:11px; color:#64748b; margin-bottom:4px; }
  .card-col .amt{ font-size:20px; font-weight:800; color:var(--ink); }
  .card-col .amt.g{ color:var(--green); }
  .card-col .per{ font-size:11px; color:#94a3b8; }
  .card-foot{ background:#F7F9FC; color:#94a3b8; font-size:10px; padding:6px 14px; }

  /* dock */
  .dock{ background:#fff; border-top:1px solid var(--line); }
  .chips{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:10px 12px; }
  .chip{ padding:8px 13px; font-size:13px; font-weight:500; border-radius:999px; cursor:pointer;
    background:#EAF7FB; color:#0B7C97; border:1px solid #CDEBF3; transition:transform .08s, filter .15s; }
  .chip:hover{ filter:brightness(.97); }
  .chip:active{ transform:scale(.95); }
  .chip.cta{ background:var(--cyan); color:#04222B; border-color:var(--cyan); font-weight:600; }

  .opts.one{ grid-template-columns:1fr; }
  .opt{ padding:12px 12px; font-size:13.5px; font-weight:600; border-radius:12px; cursor:pointer;
    background:#fff; color:var(--ink); border:1.5px solid #D6DEEC; text-align:center; transition:transform .08s, border-color .15s, box-shadow .15s; }
  .opt:hover{ border-color:var(--cyan); box-shadow:0 2px 8px rgba(20,184,221,.12); }
  .opt:active{ transform:scale(.97); }
  .opt.full{ grid-column:1 / -1; }

  .pfx{ padding:10px 12px; border-radius:999px; background:#F1F5F9; color:#475569; font-size:15px; font-weight:600; }
  .inbar input{ flex:1; padding:10px 15px; border-radius:999px; background:#F1F5F9; border:1px solid transparent; font-size:14px;

  .inbar input:focus{ border-color:var(--indigo); background:#fff; box-shadow:0 0 0 3px rgba(91,110,245,.12); }
  .send{ width:42px; height:42px; border-radius:50%; border:none; cursor:pointer; flex:0 0 auto;
    background:var(--indigo); color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; transition:transform .08s; }
  .send:active{ transform:scale(.94); }
  .send:disabled{ opacity:.45; cursor:not-allowed; }

  .privacy{ text-align:center; font-size:11px; color:#64748b; padding:12px 14px; line-height:1.6; }

  .demo-toggle{ width:100%; text-align:center; font-size:11px; color:#64748b; padding:7px; cursor:pointer;
    background:#F1F5F9; border:none; border-top:1px solid var(--line); font-family:inherit; }
  pre.demo{ margin:0; font-size:10.5px; line-height:1.55; padding:12px; overflow:auto; max-height:180px;
    background:#0B1F3A; color:#7FE3B0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .flag{ color:#FFB4A9; }

  /* video popup */
  .vmodal{ position:absolute; inset:0; z-index:60; background:rgba(4,10,20,.86); display:flex; align-items:center; justify-content:center; padding:16px; animation:pop .2s both; }
  .vbox{ position:relative; width:100%; background:#000; border-radius:14px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .vframe{ position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden; }
  .vframe #yt-player, .vframe iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  .vmask{ position:absolute; top:0; left:0; right:0; height:56px; z-index:1; pointer-events:none; background:linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,0)); }
  .vclick{ position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .vplay{ width:64px; height:64px; border-radius:50%; background:rgba(11,31,58,.7); color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; padding-left:4px; }
  .vctrl{ position:absolute; left:0; right:0; bottom:0; z-index:3; display:flex; align-items:center; gap:10px; padding:9px 12px; background:linear-gradient(0deg, rgba(0,0,0,.6), rgba(0,0,0,0)); }
  .vbtn{ background:none; border:none; color:#fff; font-size:14px; line-height:1; cursor:pointer; flex:0 0 auto; padding:2px 4px; }
  .vprog{ flex:1; height:6px; border-radius:3px; background:rgba(255,255,255,.28); cursor:pointer; position:relative; }
  .vprog-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:var(--cyan); }
  .vend{ position:absolute; inset:0; z-index:4; display:flex; gap:10px; align-items:center; justify-content:center; background:rgba(4,10,20,.94); }
  .vcap{ color:#cbd5e1; font-size:11px; text-align:center; padding:8px 10px; background:#0B1F3A; }
  .vclose{ position:absolute; top:8px; right:8px; z-index:5; width:34px; height:34px; border:none; border-radius:50%; background:rgba(0,0,0,.6); color:#fff; font-size:16px; cursor:pointer; }

const KB = [
  { id:"who",    label:"Who are you?", keywords:["who are you","your name","are you a bot","are you real","are you human","riya","who is this","real person"],
    a:"I am Jhanvi, your careers-abroad assistant from Testbook. 😊 I help nurses like you explore high-paying nursing jobs abroad, and Germany is the top option right now. For the full details, our counsellor will call you personally. Ask me anything!" },
  { id:"b2done", label:"I already have B2", keywords:["already b2","have b2","done b2","completed b2","cleared b2","b2 done","already done b2","already have german","goethe b2","telc b2","i have b2","got b2"],
    a:"That is excellent! 🎉 If you already have B2 German, you are ready for the next steps. Let me connect you straight to our counsellor, who will fast-track your profile. Please keep your phone handy!" },
  { id:"emi",    label:"Can I pay in EMI?", keywords:["emi","loan","instalment","installment","monthly","finance","afford","upfront","one time","one-time","pay later","kist","kisht"],
    a:"Yes! You can take a student loan that pays the full fee first, and you repay it in small monthly EMIs. No big one time payment. On the call, the counsellor tells you the exact monthly amount." },
  { id:"levels", label:"Which German level?", keywords:["b1","b2","a1","a2","level","how much german","which level","cefr"],
    a:"German hospitals usually want B1 to B2 level. Our course takes you all the way from A1 to B2, so you reach exactly what they need." },
  { id:"anm",    label:"Am I eligible?", keywords:["anm","eligible","eligibility","qualify","can i apply","am i","auxiliary","diploma","gnm or","gnm degree","degree enough","enough","my degree","qualification enough"],
    a:"If you have GNM or B.Sc Nursing (or Post Basic B.Sc), you can start. Final year students can begin the classes now too. If you only have ANM, that is usually not enough on its own, but share your details and we will guide you." },
  { id:"exp",    label:"Need experience?", keywords:["experience","fresher","fresh","years","working","freshers","without experience","no experience"],
    a:"Freshers are very welcome. You do not need years of experience. New and experienced nurses both take this path. You mainly need your nursing degree and B2 German." },
  { id:"age",    label:"Is there an age limit?", keywords:["age","old","too old","35","40","30","year old","born","umar"],
    a:"There is no strict age limit. Nurses of many ages move to Germany. Younger people pick up the language a bit faster, but it is open for you. The counsellor can guide you for your age." },
  { id:"ielts",  label:"Do I need IELTS?", keywords:["ielts","english","toefl","pte","language test","english exam","angrezi"],
    a:"No IELTS or English test is needed for Germany. The only language that matters here is German, up to B2, and that is exactly what we teach you." },
  { id:"recog",  label:"Is my degree valid?", keywords:["recognition","recognised","recognized","anerkennung","license","licence","registration","nursing council","valid","accept my degree","approved"],
    a:"Yes. Your Indian nursing degree is accepted in Germany through a process called Anerkennung (recognition). It is done with licensed German partners once your German is ready. We prepare you for it fully." },
  { id:"visa",   label:"What about visa?", keywords:["visa","work permit","permit","immigration","embassy","blue card"],
    a:"Germany has a dedicated work visa for qualified nurses (and the EU Blue Card for skilled professionals). Once your B2 German and degree recognition (Anerkennung) are ready, we connect you with licensed German recruiters who take the job offer and visa forward. Your counsellor gives you the exact steps." },
  { id:"family", label:"Can I take my family?", keywords:["family","spouse","husband","wife","kids","children","married","reunification","bring my","parents"],
    a:"Yes, you can take your family. Once you are settled there on a work visa, you can bring your husband or wife and your kids. The counsellor will explain the timing and papers." },
  { id:"pr",     label:"Can I settle there?", keywords:["pr","permanent","citizenship","settle","stay permanently","green card","residency","future"],
    a:"A nursing job in Germany can lead to long term stay, and later PR and even citizenship, because nurses are always needed there. The counsellor will explain the full path." },
  { id:"tax",    label:"Salary after tax?", keywords:["tax","net","in hand","in-hand","take home","after tax","deduction","gross","hand me"],
    a:"The Germany salary is before tax. After tax you still keep a good amount, and your health cover and pension are included. The exact in hand depends on your tax class, and the counsellor can give you a real number." },
  { id:"docs",   label:"What documents?", keywords:["document","documents","paperwork","certificate","transcript","passport","what do i need","marksheet"],
    a:"For Germany you will typically need your passport, nursing degree and mark sheets, Indian nursing council registration, your B2 German certificate, and the recognition (Anerkennung) papers, plus a job offer. Nothing is needed right now to start — your counsellor shares the full checklist for your stage." },
  { id:"cities", label:"Which city?", keywords:["city","cities","where in germany","location","hospital","which state","berlin","munich"],
    a:"Indian nurses work across many German cities and hospitals. The city depends on the recruiter and the hospital that hires you, and they try to keep your choice in mind." },
  { id:"stay",   label:"Where will I stay?", keywords:["accommodation","stay","house","room","live","housing","settle in","rehna"],
    a:"When you move, the hospital and recruiters usually help you with your first accommodation and settling in. You will not be on your own." },
  { id:"male",   label:"Male nurses too?", keywords:["male","man","men","boy","gender","ladka"],
    a:"Yes, male nurses are needed just as much in Germany. The path is exactly the same for you." },
  { id:"safe",   label:"Is Germany safe?", keywords:["safe","safety","secure country","women safe","alone","ladki"],
    a:"Germany is a very safe and well organised country, with strong rules to protect workers. Many Indian nurses, including women and families, live there happily." },
  { id:"process",label:"How does it work?", keywords:["process","step","steps","how does it work","procedure","pathway","roadmap","how it works","kaise"],
    a:"It is simple. First, learn German with us from A1 to B2. Second, get your degree recognised (Anerkennung). Third, we refer you to licensed German recruiters who take you through the job, visa and joining. The counsellor walks you through each step." },
  { id:"when",   label:"When can I go?", keywords:["when","how soon","start when","go to germany","timeline to move","by when","kab"],
    a:"You can start the German classes right away. The actual move happens once you reach B2 and finish recognition and visa, usually in about a year, depending on your pace." },
  { id:"other",  label:"What about USA/UK?", keywords:["usa","us","america","canada","uk","england","australia","ireland","dubai","gulf","saudi","other country","abroad"],
    a:"Right now we focus fully on Germany, because it has the biggest nurse shortage, strong pay, and a clear legal path for Indian nurses. If you like, the counsellor can still talk you through it on the call." },
  { id:"why",    label:"Why Germany?", keywords:["why germany","norcet","plan b","better than","instead of","government job","vacancy","worth it","sarkari"],
    a:"NORCET has very few seats and a lot of competition. Germany needs thousands of nurses right now, pays almost 8 to 10 times an Indian nurse salary, and your GNM or B.Sc already makes you eligible. It is a strong backup, sometimes even a better first choice." },
  { id:"time",   label:"How long does it take?", keywords:["how long","duration","time","months","how many months","take","kitna time"],
    a:"It usually takes about 10 to 12 months to go from A1 to B2, depending on how fast you learn. Your counsellor will map a clear timeline for you on the call." },
  { id:"salary", label:"Salary in Germany?", keywords:["salary","earn","pay","income","money","package","how much do nurses","lakh","per month","kitna"],
    a:"In Germany, nurses earn around 2 to 2.5 lakh rupees a month (it can change a bit by hospital and city). In India a staff nurse gets about 25,000. Plus you get good benefits and paid leave." },
  { id:"german", label:"Do I need German?", keywords:["german","language","speak german","learn german","without german","don't know german","dont know german","bhasha"],
    a:"No, you do not need any German right now. We start you from zero (A1) and take you up to B2, which is what German hospitals want. Our teachers guide you at every step." },

// lead nurture score (0-100) + tier, from tracked activity
function nurtureOf(d){
  let s=0;
  if(d.phone) s+=10;
  if(d.lang) s+=8;
  if(d.nurse==="nurse"||d.nurse==="student") s+=12;
  if(d.qualification) s+=10;
  if(d.abroad==="yes") s+=12; else if(d.abroad) s+=6;
  if(d.country) s+=8;
  s += Math.min(18, ((d.qCount||0)+(d.hubN||0)+(d.gN||0))*3);
  if(d.gpushed) s+=8;
  if(d.videoStarted) s+=6;
  s += Math.round((d.videoPct||0)/10);
  if(d.videoCompleted) s+=6;
  if(d.slot) s+=12;
  s = Math.min(100, s);
  return { score:s, tier: s>=70 ? "hot" : s>=40 ? "warm" : "cold" };
}

// full activity record for the CRM (how nurtured is this lead)
function activityOf(d, stage){
  const n = nurtureOf(d);
  return {
    nurture_score:n.score, nurture_tier:n.tier,
    current_stage: stage||null, last_stage: d.lastStage||null, stages_seen: d.stagesSeen||[],
    started_at: d.startedAt||null, last_active_at: d.lastActiveAt||null,
    nurse: d.nurse||null, abroad: d.abroad||null, country: d.country||null, language: d.language||null,
    questions_asked: (d.qCount||0), question_list: d.qList||[],
    chip_interactions: (d.hubN||0)+(d.gN||0),
    germany_explored: !!d.gpushed,
    video_started: !!d.videoStarted, video_language: d.videoLangChosen||null,
    video_watched_pct: d.videoPct||0, video_watch_sec: d.videoWatchSec||0, video_completed: !!d.videoCompleted,
  };
}

// pull the 11-char video id out of any YouTube URL form (watch?v= , youtu.be/ , /shorts/ , /embed/) or a bare id
function ytId(u){
  const s = String(u||"").trim();
  const m = s.match(/(?:v=|youtu\.be\/|\/shorts\/|\/live\/|\/embed\/)([\w-]{11})/);
  return m ? m[1] : s;
}

const norm = (s)=> (s||"").toLowerCase().replace(/[^a-z0-9ऀ-ॿ ]+/g," ").replace(/\s+/g," ").trim();
const esc = (k)=> k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
// whole-word (space-bounded) match so "pr" can't match "prime", "man" can't match "German"
function matchFor(text){
  const q = " " + norm(text) + " ";
  let best=null, bestScore=0;
  KB.forEach((e)=>{
    let score=0;
    e.keywords.forEach((k)=>{ if(new RegExp(" "+esc(k)+" ").test(q)) score += k.includes(" ")?2:1; });
    if(score>bestScore){ bestScore=score; best=e; }
  });
  return bestScore>0 ? best : null;   // returns the KB entry (or null)
}

/* Phone: never block. Return {ok, value, flag, display}. */
function classifyPhone(raw){
  const t = (raw||"").trim();
  const digits = t.replace(/\D/g,"");
  let local = digits, hadIN = t.startsWith("+91") || (digits.length===12 && digits.startsWith("91"));
  if(digits.length===12 && digits.startsWith("91")) local = digits.slice(2);
  else if(digits.length===11 && digits.startsWith("0")) local = digits.slice(1);
  if(/^[6-9]\d{9}$/.test(local)) return { ok:true, value:local, flag:null, display:"+91 "+local };
  // looks like a foreign number
  if((t.startsWith("+") && !hadIN) || digits.length>10) return { ok:false, value:t, flag:"non_india", display:t };
  return { ok:false, value:t, flag:"invalid", display:t };
}

        events:{
          onReady:(e)=>{ try{ e.target.playVideo(); }catch(_){} try{ setVideoMuted(e.target.isMuted()); }catch(_){} },
          onStateChange:(e)=>{ const S=window.YT.PlayerState;

            else if(e.data===S.PAUSED){ setVideoPlaying(false); }

      fetch(CONFIG.OCRM.endpoint, { method:"POST",
        headers:{ "Content-Type":"application/json", "X-PUBLIC-KEY":CONFIG.OCRM.publicKey },
        body:JSON.stringify(body), keepalive:true });
    }catch(e){ /* fire and forget */ }
  };

  // build a v2_staging row (mirrors the Germany site's shape; extra fields live in source_detail)
  const buildStagingRow = (data, lead_stage)=>{
    const d = String(data.phone||"").replace(/\D/g,""); const local = d.length>=10 ? d.slice(-10) : d;
    return {
      name: (data.name||"").trim() || null,
      phone: local || (data.phone||null),
      source: "norcet_offline", status: "pending",
      source_detail: {
        cohort:"NORCET Offline leads", campaign:"NORCET Offline leads", lead_type:"norcet_offline_chatbot",
        channel:"norcet_exit", funnel:"germany_nursing", form:"germany_chatbot", exam_center:CONFIG.EXAM_CENTER, lead_stage,
        qualification:data.qualification||null, city:data.city||null, preferred_language:data.language||null,
        preferred_time:data.slot||null, chat_query:data.question||null, captured_at:data.capturedAt||null,
        phone_valid: data.phoneValid===undefined ? null : data.phoneValid, phone_flag: data.phoneFlag||null,
        activity: activityOf(data, lead_stage),
        ...utmParams(),
      },
    };
  };
  const supaHeaders = ()=> ({ "Content-Type":"application/json", apikey:CONFIG.SUPABASE.anon, Authorization:"Bearer "+CONFIG.SUPABASE.anon });
  // PAYLOAD 2 → v2_staging: INSERT once at phone-capture (guaranteed capture, even for drop-offs).
  const submitLead = (data, lead_stage)=>{
    if(!CONFIG.SUPABASE || !CONFIG.SUPABASE.url || insertedRef.current) return;
    insertedRef.current = true;
    try{
      fetch(CONFIG.SUPABASE.url+"/rest/v1/v2_staging?select=id", { method:"POST", headers:{ ...supaHeaders(), Prefer:"return=representation" }, body:JSON.stringify(buildStagingRow(data, lead_stage)), keepalive:true })
        .then(r=>r.json()).then(j=>{ if(Array.isArray(j)&&j[0]&&j[0].id){ rowIdRef.current=j[0].id; patchStaging(lead); } }).catch(()=>{});
    }catch(e){ /* non-blocking */ }
  };
  // enrich the SAME row as the lead engages (no duplicates); keeps nurture fresh for drop-offs too
  const patchStaging = (data)=>{
    if(!CONFIG.SUPABASE || !CONFIG.SUPABASE.url || !rowIdRef.current) return;
    try{
      fetch(CONFIG.SUPABASE.url+"/rest/v1/v2_staging?id=eq."+rowIdRef.current, { method:"PATCH", headers:{ ...supaHeaders(), Prefer:"return=minimal" }, body:JSON.stringify({ source_detail: buildStagingRow(data, data.lastStage||null).source_detail }), keepalive:true }).catch(()=>{});
    }catch(e){}
  };

  // ── language + KB-answer helpers ──
  const LANG = lead.lang || "en";
  const M = (en, hi)=> LANG==="hi" ? hi : en;                        // scripted message
  const A = (e)=> (LANG==="hi" && HI[e.id]) ? HI[e.id] : e.a;        // KB answer (Hindi if available)
  const cName = (k)=> M(CO(k).name.en, CO(k).name.hi);

  const begin = ()=>{ me("Yes, please help me"); say("Great! Please share your name."); setStage("name"); };

  const saveName = ()=>{
    const v = input.trim(); if(!v) return;
    me(v); setLead((l)=>({ ...l, name:v })); setInput("");
    say(`Nice to meet you, ${v.split(" ")[0]}! 😊 Please share your mobile number. I will send you the details and a free eligibility check there.`);
    setStage("phone");
  };

  const savePhone = ()=>{
    const raw = input.trim(); if(!raw) return;
    const c = classifyPhone(raw);
    if(!c.ok){
      me(c.display); setInput("");
      const tries = phoneTries + 1; setPhoneTries(tries);
      say(tries===1
        ? "Hmm, that does not look like a valid Indian mobile number. 🤔 Please type your 10-digit number (starting 6, 7, 8 or 9)."
        : "That still is not a valid 10-digit Indian mobile number. Please check and type just the 10 digits. 🙏");
      return;
    }
    const next = { ...lead, phone:c.value, phoneValid:true, phoneFlag:null, capturedAt:new Date().toISOString() };
    me(c.display); setLead(next); setInput(""); setPhoneTries(0);
    pushToOCRM(next); submitLead(next, "phone_captured");
    say("Perfect, thank you! 🙌", 550);
    setTimeout(()=> say("Which language are you most comfortable in?", 500), 1000);
    setTimeout(()=> setStage("lang"), 1500);
  };

  const pickLang = (o)=>{
    const code = o.code;
    me(o.label); setLead((l)=>({ ...l, language:o.label, lang:code }));
    const m = (en,hi)=> code==="hi" ? hi : en;
    say(m("Perfect, let us continue. 🙂 First — are you a nurse, or studying nursing?",
          "बढ़िया, चलिए आगे बढ़ते हैं। 🙂 सबसे पहले — क्या आप नर्स हैं, या नर्सिंग की पढ़ाई कर रही हैं?"), 600);
    setTimeout(()=> setStage("nurse"), 1150);
  };

  const pickNurse = (o)=>{
    me(o.label); setLead((l)=>({ ...l, nurse:o.key }));
    if(o.key==="no"){
      say(M("No problem! This guide is mainly for nurses, but I can still have our counsellor share options with you. 🙂",
            "कोई बात नहीं! यह गाइड मुख्यतः नर्सों के लिए है, फिर भी मैं काउंसलर से आपको विकल्प भिजवा सकती हूँ। 🙂"), 600);
      setTimeout(()=> setStage("abroad"), 1150); return;
    }
    say(M("Great! What is your nursing qualification?", "बढ़िया! आपकी नर्सिंग योग्यता क्या है?"), 500);
    setTimeout(()=> setStage("qual"), 1000);
  };

  const pickQual = (o)=>{
    me(o); setLead((l)=>({ ...l, qualification:o }));
    say(M("Got it 👍 Are you looking to work abroad?", "समझ गई 👍 क्या आप विदेश में काम करना चाहती हैं?"), 500);
    setTimeout(()=> setStage("abroad"), 1000);
  };

  const pickAbroad = (o)=>{
    me(o.label); setLead((l)=>({ ...l, abroad:o.key }));
    say(M("Nice! Which country interests you the most? You can compare others too.",
          "बढ़िया! आपको कौन-सा देश सबसे ज़्यादा पसंद है? आप बाकी की तुलना भी कर सकती हैं।"), 500);
    setTimeout(()=> setStage("country"), 1000);
  };

  const pickCountry = (k)=>{
    me(k==="none" ? M("Not sure yet","अभी तय नहीं") : (CO(k).flag+" "+cName(k)));
    setLead((l)=>({ ...l, country:k==="none"?null:k }));
    say(M("Perfect! Ask me anything 👇 — compare countries, which pays best, visa & documents, or the cost of going.",
          "बढ़िया! कुछ भी पूछिए 👇 — देशों की तुलना, कौन सबसे ज़्यादा देता है, वीज़ा और दस्तावेज़, या जाने का खर्च।"), 600);
    setTimeout(()=> setStage("hub"), 1150);
  };

  const bumpHub = ()=>{ const n=(lead.hubN||0)+1; setLead((l)=>({ ...l, hubN:n }));
    if(n>=2 && !lead.gpushed){ setLead((l)=>({ ...l, gpushed:true })); setTimeout(()=> gpush(true), 2000); } };
  const bumpG = ()=>{ const n=(lead.gN||0)+1; setLead((l)=>({ ...l, gN:n }));
    if(n>=2 && !lead.vpushed){ setLead((l)=>({ ...l, vpushed:true })); setTimeout(()=> offerVideo(), 2100); } };

  const compareCountries = ()=>{
    me(M("Compare countries","देशों की तुलना"));
    const lines = COUNTRIES.map(c=> c.flag+" "+M(c.name.en,c.name.hi)+": "+M(c.salary.en,c.salary.hi)).join("\n");
    say(M("Here is a quick salary picture 👇\n\n","सैलरी की एक झलक 👇\n\n")+lines, 750);
    setTimeout(()=> say(M("But salary is only part of it. Germany needs NO IELTS, costs less to start, and has a clear PR + family + EU path — so for nurses it is the best overall option. 🇩🇪",
                          "पर सैलरी ही सब कुछ नहीं। जर्मनी में IELTS नहीं चाहिए, शुरू करना सस्ता है, और PR + परिवार + EU का साफ़ रास्ता है — इसलिए नर्सों के लिए यह सबसे अच्छा विकल्प है। 🇩🇪"), 850), 1150);
    bumpHub();
  };
  const whichPays = ()=>{
    me(M("Which pays best?","सबसे ज़्यादा कौन देता है?"));
    say(M("Honestly, Australia, Canada and the UK can pay a little more on paper (₹2.5–3.5 lakh). But they need IELTS/OET plus costly exams and can take 2+ years. Germany pays ₹2–2.5 lakh with NO IELTS, lower cost and a faster, clearer path — so for most Indian nurses it is the best value. 🇩🇪",
          "सच कहूँ तो ऑस्ट्रेलिया, कनाडा और यूके कागज़ पर थोड़ा ज़्यादा दे सकते हैं (₹2.5–3.5 लाख)। पर उनमें IELTS/OET और महँगे एग्ज़ाम लगते हैं और 2+ साल लग सकते हैं। जर्मनी ₹2–2.5 लाख देता है, बिना IELTS, कम खर्च और तेज़ रास्ते के साथ — इसलिए ज़्यादातर भारतीय नर्सों के लिए यही सबसे अच्छा है। 🇩🇪"), 850);
    bumpHub();
  };
  const visaDocs = ()=>{
    me(M("Visa & documents","वीज़ा और दस्तावेज़"));
    const c = CO(lead.country || "germany");
    say(c.flag+" "+M(c.name.en,c.name.hi)+" — "+M("visa: ","वीज़ा: ")+M(c.visa.en,c.visa.hi)+". "+
        M("You will typically need your passport, nursing degree & mark sheets, nursing registration, the required language/exam, and a job offer.",
          "आमतौर पर चाहिए: पासपोर्ट, नर्सिंग डिग्री और मार्कशीट, नर्सिंग रजिस्ट्रेशन, ज़रूरी भाषा/एग्ज़ाम, और जॉब ऑफ़र।"), 800);
    bumpHub();
  };
  const costGoing = ()=>{
    me(M("Cost of going","जाने का खर्च"));
    const c = CO(lead.country || "germany");
    say(c.flag+" "+M(c.name.en,c.name.hi)+" — "+M(c.cost.en,c.cost.hi)+"."+
        (c.k==="germany" ? " "+M("We charge only for the German training + interview prep (₹1,00,000, easy EMI) — nothing for the referral process.",
                                 "हम सिर्फ़ जर्मन ट्रेनिंग + इंटरव्यू तैयारी के लिए चार्ज करते हैं (₹1,00,000, आसान EMI) — रेफ़रल के लिए कुछ नहीं।") : ""), 800);
    bumpHub();
  };

  const gpush = (auto)=>{
    if(!auto){ me(M("Explore Germany 🇩🇪","जर्मनी एक्सप्लोर करें 🇩🇪")); setLead((l)=>({ ...l, gpushed:true })); }
    say(auto
      ? M("By the way — for a nurse like you, Germany is usually the best choice. Would you like to explore it? 🇩🇪","वैसे — आप जैसी नर्स के लिए जर्मनी आमतौर पर सबसे अच्छा विकल्प है। क्या आप इसे एक्सप्लोर करना चाहेंगी? 🇩🇪")
      : M("Great! Let me show you why Germany is the top pick. 🇩🇪","बढ़िया! मैं बताती हूँ जर्मनी सबसे अच्छा क्यों है। 🇩🇪"), 650);
    setTimeout(()=> setStage("gpush"), auto?1250:1050);
  };
  const pickGpush = (yes)=>{
    if(yes){ me(M("Yes, tell me","हाँ, बताइए")); gBenefits(); }
    else { me(M("Maybe later","शायद बाद में")); say(M("No problem! Ask me anything else, or tap I am done. 🙂","कोई बात नहीं! और कुछ पूछिए, या 'I am done' दबाइए। 🙂")); setStage("hub"); }
  };
  const gBenefits = ()=>{
    say(M("Here is why nurses love Germany 🇩🇪","नर्सें जर्मनी को क्यों पसंद करती हैं 🇩🇪"), 600);
    setTimeout(()=> push({ from:"bot", card:"salary" }), 1150);
    setTimeout(()=> say(M("• ₹2–2.5 lakh/month   • No IELTS (German instead)   • Huge nurse shortage   • Family can join   • Long-term PR path   • Low starting cost, easy EMI",
                          "• ₹2–2.5 लाख/महीना   • कोई IELTS नहीं (जर्मन)   • नर्सों की भारी कमी   • परिवार साथ आ सकता है   • लंबी अवधि PR   • कम शुरुआती खर्च, आसान EMI"), 850), 1550);
    setTimeout(()=> say(M("Do you have any questions about Germany? 😊","जर्मनी के बारे में कोई सवाल है? 😊"), 600), 2700);
    setTimeout(()=> setStage("ghub"), 3300);
  };

  const offerVideo = ()=>{ say(M("Would you like to watch a short video about the Germany path — English or Hindi? 🎬","क्या आप जर्मनी के रास्ते पर एक छोटा वीडियो देखना चाहेंगी — इंग्लिश या हिंदी? 🎬")); setStage("video_lang"); };
  const playVideoLang = (langLabel)=>{
    me("Watch in "+langLabel+" ▶");
    watchRef.current={ pct:0, sec:0 };
    setVideoLang(langLabel); setVideoId(ytId(CONFIG.PROCESS_VIDEOS[langLabel])); setShowVideo(true);
    setLead((l)=>({ ...l, videoStarted:true, videoLangChosen:langLabel }));
    say(M("Here you go! Tap ✕ when you are done, and ask me anything else. 😊","लीजिए! हो जाए तो ✕ दबाइए, और कुछ भी पूछिए। 😊"), 500);
    setStage("ghub");
  };
  const skipVideo = ()=>{ me(M("Just tell me in short","बस संक्षेप में बताइए")); const e=KB.find(x=>x.id==="process"); say(A(e)); setStage("ghub"); };

  const answerChip = (id, label)=>{ const e=KB.find(x=>x.id===id); me(label); say(A(e)); bumpG(); };

  const handleFreeText = ()=>{
    const v = input.trim(); if(!v) return;
    me(v); setInput("");
    const e = matchFor(v);
    setLead((l)=>({ ...l, qCount:(l.qCount||0)+1, qList:[...(l.qList||[]).slice(-14), { q:v, topic:e?e.id:"unmatched", at:new Date().toISOString() }] }));
    const back = stage==="ghub" ? bumpG : bumpHub;
    if(e && e.id==="process" && stage==="ghub"){ offerVideo(); return; }
    if(e){ say(A(e)); back(); }
    else {
      setLead((l)=>({ ...l, question:v }));
      say(M("Haha, I am not fully sure about that one 😅 I have saved it for your counsellor. I am best with nursing careers abroad, especially Germany — fees, language, salary, visa. Ask me anything there!",
            "हाहा, इसका मुझे पूरा पता नहीं 😅 मैंने इसे काउंसलर के लिए नोट कर लिया है। मैं विदेश में नर्सिंग करियर में सबसे अच्छी हूँ, ख़ासकर जर्मनी — फीस, भाषा, सैलरी, वीज़ा। वहाँ कुछ भी पूछिए!"));
      back();
    }
  };

  const askSlot = ()=>{ me(M("I am done","हो गया")); say(M("Great! One last thing — when should our counsellor call you? 😊","बढ़िया! आख़िरी बात — काउंसलर आपको कब कॉल करें? 😊")); setStage("slot"); };
  const finish = (slot)=>{
    const s = slot || lead.slot || null;
    const f = { ...lead, slot:s };
    setLead(f); submitLead(f, "completed");
    say(M(`You are all set, ${(lead.name||"there").split(" ")[0]}! 🎉 Our counsellor will call you${s ? " in your "+s+" slot" : " soon"}. Keep your phone handy, okay? 😊`,
          `सब तैयार है, ${(lead.name||"").split(" ")[0]}! 🎉 हमारे काउंसलर आपको${s ? " आपके "+s+" स्लॉट में" : " जल्द"} कॉल करेंगे। फ़ोन पास रखिए! 😊`));
    setStage("done");
  };

  const onKey = (e)=>{ if(e.key!=="Enter") return; if(stage==="name") saveName(); else if(stage==="phone") savePhone(); else handleFreeText(); };
  const sendClick = ()=> stage==="name" ? saveName() : stage==="phone" ? savePhone() : handleFreeText();

  const showInput = ["name","phone","hub","ghub"].includes(stage);
  const placeholder = stage==="name" ? "Type your name" : stage==="phone" ? "Your mobile number" : M("Ask Jhanvi anything","झांवी से कुछ भी पूछें");

  // show Jhanvi's face only on the last bot message of a run
  const lastBot = (i)=> msgs[i].from==="bot" && (!msgs[i+1] || msgs[i+1].from!=="bot") && !typing;

  return (
    <div className="phone">
      <div className="hdr">
        <div className="hdr-top">
          <div className="avatar"><Jhanvi/></div>
          <div style={{ flex:1, minWidth:0 }}>
            <h1>Jhanvi
              <svg className="tick" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="#14B8DD"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#04222B" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </h1>
            <div className="sub"><span className="dot"></span> Global Careers by Testbook · Online</div>
          </div>
        </div>
        <div className="badges">
          <span><b>1-on-1</b> counselling</span>
          <span><b>100%</b> free</span>
        </div>
      </div>

      <div className="canvas">
        {msgs.map((m,i)=> m.card==="salary"
          ? <SalaryCard key={i} />
          : <Group key={i} from={m.from} showFace={lastBot(i)}>{m.node}</Group>)}
        {typing && <Typing/>}
        {stage==="start" && !typing && (
          <div className="grp bot"><div className="mini hide"></div>
            <button className="chip cta" onClick={begin}>Yes, help me →</button>
          </div>
        )}
        <div ref={endRef} />
      </div>

      <div className="dock">

        {showInput && (
          <div className="inbar">
            {stage==="phone" && <span className="pfx">+91</span>}
            <input ref={inRef} value={input} onChange={(e)=>setInput(e.target.value)} onKeyDown={onKey}
              inputMode={stage==="phone" ? "tel" : "text"} maxLength={stage==="phone" ? 18 : 90}
              placeholder={placeholder} />
            <button className="send" onClick={sendClick} aria-label="Send" disabled={!input.trim()}>↑</button>
          </div>
        )}

        {stage==="lang" && (
          <div className="opts">
            {CHAT_LANGS.map((o)=>
              <button key={o.code} className="opt" onClick={()=>pickLang(o)}>{o.label}</button>)}
          </div>
        )}

        {stage==="nurse" && (
          <div className="opts one">
            {[{key:"nurse",label:M("Yes, I am a nurse","हाँ, मैं नर्स हूँ")},{key:"student",label:M("Final-year student","फ़ाइनल ईयर छात्र")},{key:"no",label:M("No","नहीं")}].map((o)=>
              <button key={o.key} className="opt" onClick={()=>pickNurse(o)}>{o.label}</button>)}
          </div>
        )}

        {stage==="qual" && (
          <div className="opts">
            {["GNM","B.Sc Nursing","Post Basic B.Sc","ANM"].map((o)=>
              <button key={o} className="opt" onClick={()=>pickQual(o)}>{o}</button>)}
          </div>
        )}

        {stage==="abroad" && (
          <div className="opts one">
            {[{key:"yes",label:M("Yes, actively","हाँ, सक्रिय रूप से")},{key:"explore",label:M("Just exploring","बस देख रही हूँ")},{key:"unsure",label:M("Not sure yet","अभी तय नहीं")}].map((o)=>
              <button key={o.key} className="opt" onClick={()=>pickAbroad(o)}>{o.label}</button>)}
          </div>
        )}

        {stage==="country" && (
          <div className="opts">
            {COUNTRIES.map((c)=>
              <button key={c.k} className="opt" onClick={()=>pickCountry(c.k)}>{c.flag} {M(c.name.en,c.name.hi)}</button>)}
            <button className="opt full" onClick={()=>pickCountry("none")}>{M("Not sure yet","अभी तय नहीं")}</button>
          </div>
        )}

        {stage==="hub" && (
          <div className="chips">
            <button className="chip" onClick={compareCountries}>{M("Compare countries","देशों की तुलना")}</button>
            <button className="chip" onClick={whichPays}>{M("Which pays best?","कौन ज़्यादा देता है?")}</button>
            <button className="chip" onClick={visaDocs}>{M("Visa & documents","वीज़ा और दस्तावेज़")}</button>
            <button className="chip" onClick={costGoing}>{M("Cost of going","जाने का खर्च")}</button>
            <button className="chip cta" onClick={()=>gpush(false)}>{M("Explore Germany 🇩🇪","जर्मनी एक्सप्लोर करें 🇩🇪")}</button>
            <button className="chip" onClick={askSlot}>{M("I am done","हो गया")}</button>
          </div>
        )}

        {stage==="gpush" && (
          <div className="opts">
            <button className="opt" onClick={()=>pickGpush(true)}>{M("Yes, tell me","हाँ, बताइए")}</button>
            <button className="opt" onClick={()=>pickGpush(false)}>{M("Maybe later","शायद बाद में")}</button>
          </div>
        )}

        {stage==="ghub" && (
          <div className="chips">
            <button className="chip" onClick={()=>answerChip("salary",M("Salary","सैलरी"))}>{M("Salary","सैलरी")}</button>
            <button className="chip" onClick={()=>answerChip("german",M("German language","जर्मन भाषा"))}>{M("German language","जर्मन भाषा")}</button>
            <button className="chip" onClick={()=>answerChip("visa",M("Visa & docs","वीज़ा और दस्तावेज़"))}>{M("Visa & docs","वीज़ा और दस्तावेज़")}</button>
            <button className="chip" onClick={()=>answerChip("pr",M("PR & family","PR और परिवार"))}>{M("PR & family","PR और परिवार")}</button>
            <button className="chip" onClick={()=>answerChip("cost",M("Cost & EMI","फीस और EMI"))}>{M("Cost & EMI","फीस और EMI")}</button>
            <button className="chip cta" onClick={offerVideo}>{M("Watch a short video 🎬","छोटा वीडियो देखें 🎬")}</button>
            <button className="chip" onClick={askSlot}>{M("I am done","हो गया")}</button>
          </div>
        )}

        {stage==="video_lang" && (
          <div className="chips">
            {(lead.lang==="hi" ? ["Hindi","English"] : ["English","Hindi"]).map((L)=>
              <button key={L} className="chip cta" onClick={()=>playVideoLang(L)}>▶ {L==="Hindi" ? "हिंदी" : "English"}</button>)}
            <button className="chip" onClick={skipVideo}>{M("Just tell me in short","बस संक्षेप में बताइए")}</button>
          </div>
        )}

        {stage==="slot" && (
          <div className="chips">
            {SLOTS.map((o)=>
              <button key={o} className="chip" onClick={()=>{ me(o); finish(o); }}>{o}</button>)}
          </div>
        )}

        {stage==="done" && (
          <div className="privacy">🔒 {M("No spam","कोई स्पैम नहीं")} · 🚫 {M("No unwanted calls","कोई अनचाही कॉल नहीं")} · ✅ {M("100% free","100% फ्री")} · {M("Your details stay private and are never sold.","आपकी जानकारी निजी रहती है, कभी नहीं बेची जाती।")}</div>
        )}
        {stage==="greet" && <div className="privacy">…</div>}
      </div>

      {showVideo && (
        <div className="vmodal" onClick={closeVideo}>
          <div className="vbox" onClick={(e)=>e.stopPropagation()}>
            <button className="vclose" onClick={closeVideo} aria-label="Close">✕</button>
            <div className="vframe">
              <div id="yt-player"></div>
              <div className="vmask"></div>
              <div className="vclick" onClick={togglePlay}>
                {!videoPlaying && !videoEnded && <div className="vplay">▶</div>}
              </div>
              <div className="vctrl" onClick={(e)=>e.stopPropagation()}>
                <button className="vbtn" onClick={togglePlay} aria-label="Play/Pause">{videoPlaying ? "❚❚" : "▶"}</button>
                <div className="vprog" onClick={seekTo}><div className="vprog-fill" style={{ width:(videoProg*100)+"%" }}></div></div>
                <button className="vbtn" onClick={toggleMute} aria-label="Mute">{videoMuted ? "🔇" : "🔊"}</button>
              </div>
              {videoEnded && (
                <div className="vend">
                  <button className="chip cta" onClick={togglePlay}>↻ Watch again</button>
                  <button className="chip" onClick={closeVideo}>Done ✓</button>
                </div>
              )}
            </div>
            <div className="vcap">How the Germany nursing pathway works · {videoLang}</div>
          </div>
        </div>
      )}

      {CONFIG.DEMO_MODE && (
        <React.Fragment>
          <button className="demo-toggle" onClick={()=>setShowData((s)=>!s)}>
            {showData ? "▾ Hide" : "▸ Show"} what flows to CRM v2 (demo)
          </button>
          {showData && (
            <pre className="demo">{JSON.stringify({
              table:"v2_staging", status:"pending", source:"offline",
              name:lead.name||null, phone:lead.phone||null,
              phone_valid: lead.phoneValid===undefined ? null : lead.phoneValid,
              phone_flag: lead.phoneFlag||null,
              source_detail:{
                channel:"norcet_exit", funnel:"germany_nursing", exam_center:CONFIG.EXAM_CENTER,
                qualification:lead.qualification||null, city:lead.city||null, preferred_language:lead.language||null,
                preferred_time:lead.slot||null, chat_query:lead.question||null, captured_at:lead.capturedAt||null,
                activity: activityOf(lead, lead.lastStage),
              },
            }, null, 2)}</pre>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
