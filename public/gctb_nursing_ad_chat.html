  { id:"family", label:"Can I take my family?", keywords:["family","spouse","husband","wife","kids","children","married","reunification","bring my","parents"],

  { id:"other",  label:"What about USA/UK?", keywords:["usa","us","america","canada","uk","england","australia","ireland","dubai","gulf","saudi","other country","abroad"],

  { id:"relocation", label:"", keywords:["relocation","shifting","move cost","settling cost","initial expense","one time cost","extra cost"],

  { id:"pcc", label:"", keywords:["police clearance","pcc","police verification","background check","character certificate"],

  { id:"medical", label:"", keywords:["medical test","medical checkup","vaccination","health checkup","fitness certificate","medical fitness","vaccine"],

  { id:"exams_other", label:"", keywords:["nclex","oet","cbt","osce","prometric","dha","haad","moh","ahpra","nmc","nmbi","nnas","which exam"],

  { id:"spousework", label:"", keywords:["spouse work","wife work","husband work","partner job","can my wife work","dependent work","family work"],

function nurtureOf(d){
  let s=0;
  if(d.phone) s+=10;
  if(d.lang) s+=8;
  if(d.nurse==="nurse"||d.nurse==="student") s+=12;
  if(d.qualification) s+=10;
  if(d.abroad==="yes") s+=12; else if(d.abroad) s+=6;
  if(d.country) s+=8;
  s += Math.min(18, ((d.qCount||0)+(d.hubN||0)+(d.gN||0))*3);
  if(d.gpushed) s+=8;
  if(d.videoStarted) s+=6;
  s += Math.round((d.videoPct||0)/10);
  if(d.videoCompleted) s+=6;
  if(d.slot) s+=12;
  s = Math.min(100, s);
  return { score:s, tier: s>=70 ? "hot" : s>=40 ? "warm" : "cold" };
}

// full activity record for the CRM (how nurtured is this lead)
function activityOf(d, stage){
  const n = nurtureOf(d);
  return {
    nurture_score:n.score, nurture_tier:n.tier,
    current_stage: stage||null, last_stage: d.lastStage||null, stages_seen: d.stagesSeen||[],
    started_at: d.startedAt||null, last_active_at: d.lastActiveAt||null,
    nurse: d.nurse||null, abroad: d.abroad||null, country: d.country||null, language: d.language||null,
    questions_asked: (d.qCount||0), question_list: d.qList||[],
    chip_interactions: (d.hubN||0)+(d.gN||0),
    germany_explored: !!d.gpushed,
    video_started: !!d.videoStarted, video_language: d.videoLangChosen||null,
    video_watched_pct: d.videoPct||0, video_watch_sec: d.videoWatchSec||0, video_completed: !!d.videoCompleted,
  };
}

// pull the 11-char video id out of any YouTube URL form (watch?v= , youtu.be/ , /shorts/ , /embed/) or a bare id
function ytId(u){
  const s = String(u||"").trim();
  const m = s.match(/(?:v=|youtu\.be\/|\/shorts\/|\/live\/|\/embed\/)([\w-]{11})/);
  return m ? m[1] : s;
}

const norm = (s)=> (s||"").toLowerCase().replace(/[^a-z0-9ऀ-ॿ ]+/g," ").replace(/\s+/g," ").trim();
const esc = (k)=> k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
// whole-word (space-bounded) match so "pr" can't match "prime", "man" can't match "German"
function matchFor(text){
  const q = " " + norm(text) + " ";
  let best=null, bestScore=0;
  KB.forEach((e)=>{
    let score=0;
    e.keywords.forEach((k)=>{ if(new RegExp(" "+esc(k)+" ").test(q)) score += k.includes(" ")?2:1; });
    if(score>bestScore){ bestScore=score; best=e; }
  });
  return bestScore>0 ? best : null;   // returns the KB entry (or null)
}

/* Phone: never block. Return {ok, value, flag, display}. */
function classifyPhone(raw){
  const t = (raw||"").trim();
  const digits = t.replace(/\D/g,"");
  let local = digits, hadIN = t.startsWith("+91") || (digits.length===12 && digits.startsWith("91"));
  if(digits.length===12 && digits.startsWith("91")) local = digits.slice(2);
  else if(digits.length===11 && digits.startsWith("0")) local = digits.slice(1);
  if(/^[6-9]\d{9}$/.test(local)) return { ok:true, value:local, flag:null, display:"+91 "+local };
  // looks like a foreign number
  if((t.startsWith("+") && !hadIN) || digits.length>10) return { ok:false, value:t, flag:"non_india", display:t };
  return { ok:false, value:t, flag:"invalid", display:t };
}

const NURSING_QUALS = ["GNM","B.Sc Nursing","Post Basic B.Sc","ANM"];
const NURSE_SPEC_KEYS = ["general medicine","general nursing","medical surgical","med surg","medical","surgical","ward","staff nurse","bedside","critical care","intensive care","icu","iccu","ccu","sicu","micu","hdu","emergency","casualty","trauma","accident","paediatric","pediatric","peads","peds","paeds","neonatal","nicu","picu","obstetric","gynae","gynaec","gyn","gynec","gynaecology","gynecology","obg","maternity","labour","labor","midwife","midwifery","antenatal","postnatal","delivery","cardiac","cardiology","cardio","cath lab","cathlab","ctvs","cvts","cardiothoracic","telemetry","oncology","onco","cancer","chemo","haemato","hemato","haematology","hematology","bmt","palliative","hospice","orthopaedic","orthopedic","ortho","neuro","neurology","neurosurgery","stroke","psychiatric","psychiatry","mental health","deaddiction","rehab","rehabilitation","community health","public health","chn","phn","rural health","school health","occupational health","home care","home health","home nursing","domiciliary","operation theatre","operation theater","perioperative","scrub","anaesthesia","anesthesia","recovery","pacu","cssd","dialysis","nephrology","nephro","renal","haemodialysis","hemodialysis","transplant","geriatric","elderly","burns","plastic","gastro","gastroenterology","hepatology","urology","uro","pulmonology","respiratory","pulmonary","tuberculosis","dermatology","skin","ent","otorhino","ophthalmic","ophthalmology","optha","diabetic","diabetes","endocrine","endocrinology","infection control","wound care","stoma","ostomy","blood bank","transfusion","immunization","immunisation","vaccination","radiology","imaging","pathology","forensic","ambulance","prehospital","general duty","gda","nursing assistant","bsc nursing","b sc nursing","gnm","anm","post basic","msc nursing"];
function validateSpecialization(text){
  var t=(text||"").toLowerCase().replace(/[._\/]/g," ").replace(/[^a-z0-9& ]+/g,"").replace(/\s+/g," ").trim();
  if(!t) return { valid:false, matched:null };
  for(var i=0;i<NURSE_SPEC_KEYS.length;i++){ var k=NURSE_SPEC_KEYS[i];
    if(k.length<=4){ if(new RegExp("(^| )"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"( |$)").test(t)) return { valid:true, matched:k }; }
    else if(t.indexOf(k)>=0){ return { valid:true, matched:k }; } }
  return { valid:false, matched:null };
}
function validateCollege(text){
  var t=(text||"").toLowerCase().trim();
  if(t.length<4) return false;
  var kws=["college","collage","institute","institut","nursing","school","univ","university","vidyalaya","mahavidyalaya","academy","hospital","medical","sciences","gnm","bsc","b sc","inst","trust","foundation"];
  for(var i=0;i<kws.length;i++){ if(t.indexOf(kws[i])>=0) return true; }
  return (t.split(/\s+/).length>=2 && t.length>=9);
}
function scoreNurse(d){
  let sc = 0;
  if(d.nurse==="nurse") sc += 2; else if(d.nurse==="student") sc += 1; else sc -= 3;
  if(NURSING_QUALS.includes(d.qualification)) sc += 2; else if(d.qualification) sc -= 1;
  if(d.specializationValid===true) sc += 2; else if(d.specialization && d.specializationValid===false) sc -= 1;
  if(d.collegeValid===true) sc += 1;
  if(d.council==="registered") sc += 2;
  else if(d.council==="studying") sc += (d.nurse==="student" ? 1 : -1);
  else if(d.council==="none") sc -= 3;
  const conf = sc>=4 ? "high" : (sc>=2 ? "medium" : "low");
  const quality = conf==="high" ? "genuine" : (conf==="medium" ? "review" : "unlikely");
  return { conf, quality, score:sc };
}

          <div className="chips">
            <button className="chip" onClick={compareCountries}>{M("Compare countries","देशों की तुलना")}</button>
            <button className="chip" onClick={whichPays}>{M("Which pays best?","कौन ज़्यादा pay करता है?")}</button>
            <button className="chip" onClick={visaDocs}>{M("Visa & documents","Visa & documents")}</button>
            <button className="chip" onClick={costGoing}>{M("Cost of going","जाने का खर्च")}</button>
            <button className="chip cta" onClick={()=>gpush(false)}>{M("Explore Germany 🇩🇪","Germany explore करें 🇩🇪")}</button>
            <button className="chip" onClick={()=>{ me(M("I am done","हो गया")); nudgeExit(); }}>{M("I am done","हो गया")}</button>
          </div>
        )}

        {stage==="nudge" && (
          <div className="opts">
            <button className="opt" onClick={()=>{ me(M("Yes, tell me more","हाँ, और बताइए")); setStage(lead.gpushed ? "ghub" : "hub"); }}>{M("Yes, tell me more 😊","हाँ, और बताइए 😊")}</button>
            <button className="opt" onClick={()=>{ me(M("Book my free call","मेरी free call book करें")); askSlot(); }}>{M("Book my free call 📞","मेरी free call book करें 📞")}</button>
          </div>
        )}

        {stage==="gpush" && (
          <div className="opts">
            <button className="opt" onClick={()=>pickGpush(true)}>{M("Yes, tell me","हाँ, बताइए")}</button>
            <button className="opt" onClick={()=>pickGpush(false)}>{M("Maybe later","शायद बाद में")}</button>
          </div>
        )}

        {stage==="ghub" && (
          <div className="chips">
            <button className="chip" onClick={()=>answerChip("salary",M("Salary","सैलरी"))}>{M("Salary","सैलरी")}</button>
            <button className="chip" onClick={()=>answerChip("german",M("German language","German language"))}>{M("German language","German language")}</button>
            <button className="chip" onClick={()=>answerChip("visa",M("Visa & docs","Visa & documents"))}>{M("Visa & docs","Visa & documents")}</button>
            <button className="chip" onClick={()=>answerChip("pr",M("PR & family","PR & family"))}>{M("PR & family","PR & family")}</button>
            <button className="chip" onClick={()=>answerChip("cost",M("Cost & EMI","Fees & EMI"))}>{M("Cost & EMI","Fees & EMI")}</button>
            <button className="chip cta" onClick={offerVideo}>{M("Watch a short video 🎬","छोटा video देखें 🎬")}</button>
            <button className="chip" onClick={()=>{ me(M("I am done","हो गया")); nudgeExit(); }}>{M("I am done","हो गया")}</button>
          </div>
        )}

        {stage==="video_lang" && (
          <div className="chips">
            {(lead.lang==="hi" ? ["Hindi","English"] : ["English","Hindi"]).map((L)=>
              <button key={L} className="chip cta" onClick={()=>playVideoLang(L)}>▶ {L==="Hindi" ? "हिंदी" : "English"}</button>)}
            <button className="chip" onClick={skipVideo}>{M("Just tell me in short","बस छोटे में बता दीजिए")}</button>
          </div>
        )}

        {stage==="slot" && (
          <div className="chips">
            {SLOTS.map((o)=>
              <button key={o} className="chip" onClick={()=>{ me(o); finish(o); }}>{o}</button>)}
          </div>
        )}
        <div ref={endRef} />
      </div>

      <div className="dock">

        {showInput && (
          <div className="inbar">
            {stage==="phone" && <span className="pfx">+91</span>}
            <input ref={inRef} value={input} onChange={(e)=>setInput(e.target.value)} onKeyDown={onKey}
              inputMode={stage==="phone" ? "tel" : "text"} maxLength={stage==="phone" ? 18 : 90}
              placeholder={placeholder} />
            <button className="send" onClick={sendClick} aria-label="Send" disabled={!input.trim()}>➤</button>
          </div>
        )}


        {stage==="done" && (
          <div className="privacy">🔒 {M("No spam","कोई स्पैम नहीं")} · 🚫 {M("No unwanted calls","कोई अनचाही कॉल नहीं")} · ✅ {M("100% free","100% फ्री")} · {M("Your details stay private and are never sold.","आपकी जानकारी निजी रहती है, कभी नहीं बेची जाती।")}</div>
        )}
        {stage==="greet" && <div className="privacy">…</div>}
      </div>

      {showVideo && (
        <div className="vmodal" onClick={closeVideo}>
          <div className="vbox" onClick={(e)=>e.stopPropagation()}>
            <button className="vclose" onClick={closeVideo} aria-label="Close">✕</button>
            <div className="vframe">
              <div id="yt-player"></div>
              <div className="vmask"></div>
              <div className="vclick" onClick={togglePlay}>
                {!videoPlaying && !videoEnded && <div className="vplay">▶</div>}
              </div>
              <div className="vctrl" onClick={(e)=>e.stopPropagation()}>
                <button className="vbtn" onClick={togglePlay} aria-label="Play/Pause">{videoPlaying ? "❚❚" : "▶"}</button>
                <div className="vprog" onClick={seekTo}><div className="vprog-fill" style={{ width:(videoProg*100)+"%" }}></div></div>
                <button className="vbtn" onClick={toggleMute} aria-label="Mute">{videoMuted ? "🔇" : "🔊"}</button>
              </div>
              {videoEnded && (
                <div className="vend">
                  <button className="chip cta" onClick={togglePlay}>↻ Watch again</button>
                  <button className="chip" onClick={closeVideo}>Done ✓</button>
                </div>
              )}
            </div>
            <div className="vcap">How the Germany nursing pathway works · {videoLang}</div>
          </div>
        </div>
      )}

      {CONFIG.DEMO_MODE && (
        <React.Fragment>
          <button className="demo-toggle" onClick={()=>setShowData((s)=>!s)}>
            {showData ? "▾ Hide" : "▸ Show"} what flows to CRM v2 (demo)
          </button>
          {showData && (
            <pre className="demo">{JSON.stringify({
              table:"v2_staging", status:"pending", source:"offline",
              name:lead.name||null, phone:lead.phone||null,
              phone_valid: lead.phoneValid===undefined ? null : lead.phoneValid,
              phone_flag: lead.phoneFlag||null,
              source_detail:{
                channel:"norcet_exit", funnel:"germany_nursing", exam_center:CONFIG.EXAM_CENTER,
                qualification:lead.qualification||null, city:lead.city||null, preferred_language:lead.language||null,
                preferred_time:lead.slot||null, chat_query:lead.question||null, captured_at:lead.capturedAt||null,
                activity: activityOf(lead, lead.lastStage),
              },
            }, null, 2)}</pre>
          )}
        </React.Fragment>
      )}
      </React.Fragment>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
