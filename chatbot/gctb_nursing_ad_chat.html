<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jhanvi · Testbook Global — Germany Nursing</title>
<meta name="description" content="Gave NORCET? Jhanvi from Testbook Global shows you what nurses earn in Germany and checks if you qualify. Free 1-on-1 counselling." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>

  :root{
    --wa-header:#075E54; --wa-header2:#128C7E; --wa-accent:#00A884;
    --wa-tick:#53BDEB; --wa-out:#DCF8C6; --wa-in:#FFFFFF;
    --wa-bg:#FBE4E6; --wa-panel:#F0F2F5; --wa-text:#111B21; --wa-sub:#667781; --warn:#E5484D;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow-x:hidden; max-width:100%; }
  body{
    font-family:-apple-system,"Segoe UI","Helvetica Neue",Helvetica,Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; color:var(--wa-text);
    min-height:100vh; min-height:100dvh; background:#0b141a; display:block;
  }
  #root{ width:100%; overflow-x:hidden; }
  /* desktop frame ONLY on real pointer devices — phones/tablets always render full-bleed */
  @media (min-width:600px) and (pointer:fine){ #root{ display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100dvh; } }

  .phone{ width:100%; max-width:100%; margin:0; display:flex; flex-direction:column;
    height:100vh; height:100dvh; min-height:100vh; min-height:100dvh; background:var(--wa-bg); overflow:hidden; position:relative; }
  @media (min-width:600px) and (pointer:fine){ .phone{ width:480px; max-width:480px; flex:0 0 480px; height:900px; height:min(100dvh,900px); min-height:0; margin:0; box-shadow:0 0 50px rgba(0,0,0,.5); } }

  /* header */
  .hdr{ background:var(--wa-header); color:#fff; flex:0 0 auto; padding-top:env(safe-area-inset-top); }
  .hdr-top{ display:flex; align-items:center; gap:9px; padding:9px 10px 9px 5px; }
  .hdr-back{ color:#fff; font-size:25px; line-height:1; padding:0 2px 2px 4px; flex:0 0 auto; opacity:.95; }
  .avatar{ width:38px; height:38px; border-radius:50%; flex:0 0 auto; overflow:hidden; background:#0b3d37; }
  .avatar svg,.avatar .face,.mini .face{ width:100%; height:100%; object-fit:cover; object-position:center 35%; display:block; }
  .hdr h1{ font-size:16px; font-weight:600; margin:0; line-height:1.15; color:#fff; }
  .hdr .sub{ font-size:12.5px; color:rgba(255,255,255,.78); margin-top:1px; display:flex; align-items:center; gap:5px; height:15px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:#7ee0a1; flex:0 0 auto; }
  .hdr-icons{ display:flex; align-items:center; gap:19px; padding:0 10px 0 4px; font-size:18px; flex:0 0 auto; }
  .hdr-icons span{ opacity:.95; }
  .hmenu-bd{ position:absolute; inset:0; z-index:49; }
  .hmenu{ position:absolute; top:54px; right:10px; z-index:50; background:#fff; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.3); overflow:hidden; min-width:200px; padding:4px 0; animation:pop .14s ease both; }
  .hmenu-item{ display:block; width:100%; text-align:left; background:none; border:none; padding:12px 16px; font-size:14.5px; color:var(--wa-text); font-family:inherit; cursor:pointer; }
  .hmenu-item:hover{ background:#f1f5f4; }

  /* chat wallpaper (original subtle texture) */
  .canvas{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px 7% 10px; scroll-behavior:smooth;
    display:flex; flex-direction:column; background-color:var(--wa-bg);
    }

  .grp{ display:flex; align-items:flex-end; margin:1.5px 0; }
  .grp.bot{ justify-content:flex-start; } .grp.user{ justify-content:flex-end; }
  .mini{ display:none; }
  .bubble{ position:relative; max-width:82%; padding:6px 9px 7px; font-size:14.3px; line-height:1.34;
    border-radius:8px; box-shadow:0 1px .4px rgba(11,20,26,.14); word-wrap:break-word; white-space:pre-wrap;
    animation:pop .16s ease both; }
  .bubble.bot{ background:var(--wa-in); color:var(--wa-text); border-top-left-radius:0; margin-left:9px; }
  .bubble.user{ background:var(--wa-out); color:var(--wa-text); border-top-right-radius:0; margin-right:9px; }
  .bubble.bot::before{ content:""; position:absolute; top:0; left:-8px; width:0; height:0; border-top:9px solid var(--wa-in); border-left:9px solid transparent; }
  .bubble.user::before{ content:""; position:absolute; top:0; right:-8px; width:0; height:0; border-top:9px solid var(--wa-out); border-right:9px solid transparent; }
  .time{ float:right; font-size:10.5px; color:var(--wa-sub); margin:5px -2px -2px 10px; line-height:1; display:inline-flex; align-items:center; gap:2px; }
  .time .tk{ color:var(--wa-tick); font-size:12px; letter-spacing:-4px; margin-left:2px; }
  @keyframes pop{ from{ opacity:0; transform:translateY(4px) scale(.99);} to{ opacity:1; transform:none;} }

  .typing{ display:inline-flex !important; gap:4px; align-items:center; padding:11px 13px !important; }
  .typing span{ width:7px; height:7px; border-radius:50%; background:#9aa6ac; animation:blink 1.3s infinite both; }
  .typing span:nth-child(2){ animation-delay:.2s; } .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink{ 0%,60%,100%{ opacity:.25; transform:translateY(0);} 30%{ opacity:1; transform:translateY(-2px);} }

  /* country picker (before compare) */
  .cmp-pick{ display:flex; flex-direction:column; gap:7px; margin-bottom:8px; }
  .cmp-chip{ display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; padding:11px 14px; border-radius:10px; background:#fff; color:var(--wa-header); border:1.5px solid rgba(7,94,84,.18); font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; text-align:left; }
  .cmp-chip .cmp-tick{ font-weight:800; font-size:16px; color:#9fb0ba; flex:0 0 auto; }
  .cmp-chip.on{ background:#eafff6; border-color:var(--wa-accent); }
  .cmp-chip.on .cmp-tick{ color:var(--wa-accent); }
  .cmp-chip.lock{ background:#eafff6; border-color:var(--wa-accent); cursor:default; }
  .cmp-chip:disabled:not(.lock){ opacity:.45; cursor:not-allowed; }

  /* Flipkart-style comparison table (chat card) */
  .cmp{ width:calc(100% - 4px); background:#fff; border-radius:11px; overflow:hidden; box-shadow:0 1px 1px rgba(11,20,26,.14); margin-left:9px; animation:pop .2s both; }
  .cmp-head{ display:flex; background:var(--wa-header); color:#fff; }
  .cmp-col{ flex:1 1 0; min-width:0; padding:10px 5px 9px; text-align:center; border-right:1px solid rgba(255,255,255,.16); }
  .cmp-col:last-child{ border-right:0; }
  .cmp-col.best{ background:rgba(143,240,198,.16); }
  .cmp-flag{ display:block; font-size:19px; line-height:1; margin-bottom:3px; }
  .cmp-name{ display:block; font-size:12px; font-weight:800; line-height:1.2; }
  .cmp-badge{ display:inline-block; margin-top:4px; font-size:7.5px; font-weight:800; letter-spacing:.4px; color:#073f31; background:#8ff0c6; border-radius:3px; padding:1.5px 4px; }
  .cmp-row{ border-top:1px solid #eef1f4; }
  .cmp-rl{ background:#f2f6f8; color:#5b6b75; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; padding:5px 9px; }
  .cmp-cells{ display:flex; }
  .cmp-cell{ flex:1 1 0; min-width:0; padding:8px 5px; text-align:center; font-size:11px; line-height:1.35; color:var(--wa-text); border-right:1px solid #eef1f4; word-break:break-word; }
  .cmp-cell:last-child{ border-right:0; }
  .cmp-cell.best{ background:#eafff6; font-weight:700; }

  /* bright white video button in the chat header */
  .hdr-cam{ display:inline-flex; align-items:center; justify-content:center; width:33px; height:33px; border-radius:50%; background:#fff; cursor:pointer; margin-right:5px; box-shadow:0 1px 5px rgba(0,0,0,.22); }
  .hdr-cam:active{ transform:scale(.92); }

  /* WhatsApp-style contact profile screen */
  .profile{ position:absolute; inset:0; z-index:55; background:#eef2f4; display:flex; flex-direction:column; overflow-y:auto; animation:vcIn .2s ease; }
  .profile .pf-top{ background:var(--wa-header); color:#fff; display:flex; align-items:center; gap:14px; padding:calc(14px + env(safe-area-inset-top)) 16px 12px; }
  .profile .pf-back{ font-size:28px; line-height:1; cursor:pointer; }
  .profile .pf-ttl{ font-size:17px; font-weight:600; }
  .profile .pf-hero{ background:var(--wa-header); color:#fff; display:flex; flex-direction:column; align-items:center; text-align:center; padding:4px 24px 30px; }
  .profile .pf-hero img{ width:148px; height:148px; border-radius:50%; object-fit:cover; object-position:center 30%; box-shadow:0 0 0 4px rgba(255,255,255,.22), 0 14px 32px rgba(0,0,0,.3); margin-bottom:16px; }
  .profile .pf-hero h2{ margin:0; font-size:24px; font-weight:800; letter-spacing:-.2px; }
  .profile .pf-role{ margin:7px 0 0; font-size:14.5px; color:#8ff0c6; font-weight:700; }
  .profile .pf-sub{ margin:7px 0 0; font-size:13.5px; color:rgba(255,255,255,.88); line-height:1.5; max-width:300px; }
  .profile .pf-online{ margin-top:13px; font-size:12.5px; color:rgba(255,255,255,.8); display:inline-flex; align-items:center; gap:6px; }
  .profile .pf-online .dot{ background:#7ee0a1; }
  .profile .pf-actions{ padding:22px 18px calc(22px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:11px; }
  .profile .pf-call{ width:100%; padding:15px; border-radius:13px; border:none; background:var(--wa-accent); color:#fff; font-size:15.5px; font-weight:700; cursor:pointer; font-family:inherit; box-shadow:0 8px 20px rgba(7,94,84,.3); }
  .profile .pf-call:active{ transform:scale(.99); }
  .profile .pf-back-btn{ width:100%; padding:13px; border-radius:13px; border:1px solid #e3e9ec; background:#fff; color:#54656f; font-size:14.5px; font-weight:600; cursor:pointer; font-family:inherit; }

  /* ===== Demo German Class — full-screen video-call style screen ===== */
  .vcall{ position:absolute; inset:0; z-index:60; display:flex; flex-direction:column; background:linear-gradient(170deg,#0b2b26 0%,#0a1f1c 55%,#071513 100%); color:#fff; animation:vcIn .22s ease; }
  @keyframes vcIn{ from{ opacity:0; transform:scale(.985);} to{ opacity:1; transform:none;} }
  .vcall .vc-top{ display:flex; align-items:center; gap:10px; padding:14px 14px calc(10px + env(safe-area-inset-top,0)) 10px; }
  .vcall .vc-back{ font-size:30px; line-height:1; cursor:pointer; width:34px; text-align:center; opacity:.9; }
  .vcall .vc-ttl{ flex:1; min-width:0; }
  .vcall .vc-ttl-main{ font-size:16px; font-weight:800; letter-spacing:.2px; }
  .vcall .vc-ttl-sub{ font-size:12px; color:rgba(255,255,255,.72); display:flex; align-items:center; gap:6px; margin-top:1px; }
  .vcall .vc-x{ font-size:17px; cursor:pointer; opacity:.8; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(255,255,255,.08); }
  .vcall .vc-live{ width:8px; height:8px; border-radius:50%; background:#ff4d4d; box-shadow:0 0 0 0 rgba(255,77,77,.6); animation:vcPulse 1.6s infinite; display:inline-block; }
  @keyframes vcPulse{ 0%{ box-shadow:0 0 0 0 rgba(255,77,77,.55);} 70%{ box-shadow:0 0 0 7px rgba(255,77,77,0);} 100%{ box-shadow:0 0 0 0 rgba(255,77,77,0);} }
  .vcall .vc-stage{ position:relative; flex:1; margin:4px 14px 0; border-radius:20px; overflow:hidden; background:#09201d; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); min-height:0; }
  .vcall .vc-tile{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(130% 90% at 50% 25%,#13433b 0%,#0a2420 70%); }
  .vcall .vc-tile img{ width:150px; height:150px; border-radius:50%; object-fit:cover; object-position:center 30%; box-shadow:0 0 0 4px rgba(255,255,255,.16), 0 18px 40px rgba(0,0,0,.4); }
  .vcall .vc-badge{ position:absolute; left:12px; bottom:12px; display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; background:rgba(0,0,0,.42); backdrop-filter:blur(4px); padding:5px 11px; border-radius:999px; }
  .vcall .vc-pip{ position:absolute; right:12px; bottom:12px; width:74px; height:96px; border-radius:13px; background:linear-gradient(160deg,#2a3942,#1a262d); display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:800; color:rgba(255,255,255,.85); box-shadow:0 6px 18px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.08); }
  .vcall .vc-sheet{ background:#fff; color:#111b21; border-radius:22px 22px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0)); box-shadow:0 -12px 34px rgba(0,0,0,.35); }
  .vcall .vc-q{ font-size:14.5px; line-height:1.5; margin:2px 0 8px; }
  .vcall .vc-q2{ font-size:14px; font-weight:800; margin:0 0 12px; }
  .vcall .vc-opts{ display:flex; flex-direction:column; gap:9px; }
  .vcall .vc-btn{ width:100%; padding:14px 16px; border-radius:13px; border:1.5px solid #d7e0e4; background:#fff; color:#0a7a5f; font-size:15px; font-weight:700; cursor:pointer; text-align:center; font-family:inherit; }
  .vcall .vc-btn:active{ transform:scale(.99); }
  .vcall .vc-cta{ background:var(--wa-accent); border-color:var(--wa-accent); color:#fff; box-shadow:0 8px 20px rgba(7,94,84,.3); }
  .vcall .vc-ghost{ color:#54656f; border-color:#e3e9ec; }

  /* salary card */
  .card{ max-width:88%; width:100%; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px .4px rgba(11,20,26,.14); margin-left:9px; animation:pop .2s both; }
  .card-h{ background:var(--wa-header); color:#fff; font-size:13px; font-weight:600; padding:9px 14px; }
  .card-grid{ display:grid; grid-template-columns:1fr 1fr; }
  .card-col{ padding:14px; text-align:center; } .card-col.br{ border-right:1px solid #EDF1F7; }
  .card-col .lbl{ font-size:11px; color:#64748b; margin-bottom:4px; }
  .card-col .amt{ font-size:21px; font-weight:800; color:var(--wa-text); }
  .card-col .amt.g{ color:var(--wa-header2); } .card-col .per{ font-size:11px; color:#94a3b8; }
  .card-foot{ background:#F7F9FC; color:#94a3b8; font-size:10px; padding:6px 14px; }

  /* dock */
  .dock{ background:var(--wa-panel); flex:0 0 auto; padding-bottom:env(safe-area-inset-bottom); }
  .chips{ display:flex; flex-direction:column; gap:7px; padding:6px 0 2px; }
  .chip{ width:100%; padding:11px 14px; font-size:14px; font-weight:500; border-radius:10px; cursor:pointer; background:#fff; color:var(--wa-header); border:1px solid rgba(7,94,84,.18); text-align:center; box-shadow:0 1px 1px rgba(11,20,26,.06); transition:transform .08s; }
  .chip:active{ transform:scale(.98); } .chip.cta{ background:var(--wa-accent); color:#fff; border-color:var(--wa-accent); font-weight:600; }
  .opts{ display:flex; flex-direction:column; gap:7px; padding:6px 0 2px; }
  .opt{ width:100%; padding:12px 14px; font-size:14.5px; font-weight:500; border-radius:10px; cursor:pointer; background:#fff; color:var(--wa-header); border:1px solid rgba(7,94,84,.18); text-align:center; box-shadow:0 1px 1px rgba(11,20,26,.06); transition:transform .08s, background .15s; }
  .opt:hover{ background:#f2fbf7; } .opt:active{ transform:scale(.98); }
  .inbar{ display:flex; align-items:center; gap:7px; padding:7px 9px calc(7px + env(safe-area-inset-bottom)); }
  .pfx{ padding:9px 11px; border-radius:999px; background:#fff; color:#54656f; font-size:15px; font-weight:600; box-shadow:0 1px .4px rgba(11,20,26,.1); flex:0 0 auto; }
  .inbar input{ flex:1; padding:11px 15px; border-radius:22px; background:#fff; border:none; font-size:15px; outline:none; color:var(--wa-text); font-family:inherit; min-width:0; box-shadow:0 1px .4px rgba(11,20,26,.1); }
  .inbar input::placeholder{ color:#8696a0; }
  .send{ width:45px; height:45px; border-radius:50%; border:none; cursor:pointer; flex:0 0 auto; background:var(--wa-accent); color:#fff; font-size:19px; display:flex; align-items:center; justify-content:center; transition:transform .08s; box-shadow:0 1px 2px rgba(0,0,0,.18); }
  .send:active{ transform:scale(.92); } .send:disabled{ opacity:.55; cursor:not-allowed; }
  .privacy{ text-align:center; font-size:11px; color:var(--wa-sub); padding:10px 14px; line-height:1.6; }

  /* ad landing */
  .welcome{ position:absolute; inset:0; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:26px 22px calc(26px + env(safe-area-inset-bottom)); overflow-y:auto;
    background:linear-gradient(165deg,#0a6b5f 0%,#064039 100%); color:#fff; }
  .welcome h2{ font-size:23px; font-weight:800; margin:0 0 5px; line-height:1.28; max-width:360px; }
  .welcome h2 .hl{ color:#8ff0c6; }
  .welcome .wlogo{ position:absolute; top:14px; right:14px; z-index:5; background:#fff; padding:7px 14px 7px 11px; border-radius:999px; box-shadow:0 6px 16px rgba(0,0,0,.22); display:inline-flex; align-items:center; gap:7px; }
  .welcome .wlogo-mark{ width:22px; height:19px; display:block; flex:none; }
  .welcome .wlogo-word{ color:#12182A; font-weight:800; font-size:16px; letter-spacing:-.5px; line-height:1; }
  .welcome .wava{ position:relative; width:112px; height:112px; margin:0 auto 14px; }
  .welcome .wava img{ width:100%; height:100%; border-radius:50%; object-fit:cover; object-position:center 32%; box-shadow:0 0 0 4px rgba(255,255,255,.22), 0 14px 32px rgba(0,0,0,.32); }
  .welcome .wonline{ position:absolute; right:8px; bottom:8px; width:19px; height:19px; border-radius:50%; background:#25D366; box-shadow:0 0 0 3px #0a6b5f; }
  .welcome .wrole{ font-size:12.5px; color:rgba(255,255,255,.82); margin:0 0 13px; display:flex; align-items:center; gap:6px; justify-content:center; }
  .welcome .wrole .dot{ background:#7ee0a1; }
  .welcome .sub{ font-size:13.5px; color:rgba(255,255,255,.86); margin:0 0 20px; line-height:1.5; max-width:330px; }
  .welcome .card2{ width:100%; max-width:350px; background:#fff; border-radius:18px; padding:18px 16px 16px; box-shadow:0 20px 45px rgba(0,0,0,.3); }
  .welcome .logo{ width:168px; max-width:58%; margin:0 auto 15px; display:block; }
  .welcome .field{ width:100%; margin-bottom:10px; text-align:left; }
  .welcome input{ width:100%; padding:13px 15px; border-radius:11px; border:1.5px solid #D6DEEC; font-size:15px; font-family:inherit; outline:none; color:var(--wa-text); background:#fff; }
  .welcome input:focus{ border-color:var(--wa-accent); box-shadow:0 0 0 3px rgba(0,168,132,.14); }
  .welcome .phonewrap{ display:flex; align-items:center; gap:8px; }
  .welcome .phonewrap .cc{ padding:13px 12px; border-radius:11px; background:#F0F2F5; color:#54656f; font-weight:700; font-size:15px; flex:0 0 auto; }
  .welcome .werr{ color:var(--warn); font-size:12px; margin:-2px 0 7px; min-height:15px; text-align:left; }
  .welcome .go{ width:100%; padding:14px; border:none; border-radius:11px; background:var(--wa-accent); color:#fff; font-weight:800; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:filter .15s, transform .08s; }
  .welcome .go:hover{ filter:brightness(1.05); } .welcome .go:active{ transform:scale(.98); } .welcome .go:disabled{ opacity:.5; cursor:not-allowed; }
  .welcome .wtiny{ font-size:11.5px; color:rgba(255,255,255,.8); margin-top:15px; }

  .success{ flex:1; background:linear-gradient(160deg,#12a973,#0a7d55); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; animation:pop .3s both; }
  .success .stick{ width:96px; height:96px; border-radius:50%; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:54px; margin-bottom:22px; }
  .success h2{ font-size:27px; font-weight:800; margin:0 0 8px; } .success p{ font-size:16px; margin:0; opacity:.95; }

  .demo-toggle{ width:100%; text-align:center; font-size:11px; color:#64748b; padding:7px; cursor:pointer; background:#F1F5F9; border:none; border-top:1px solid #E4E9F2; font-family:inherit; }
  pre.demo{ margin:0; font-size:10.5px; line-height:1.55; padding:12px; overflow:auto; max-height:180px; background:#0B1F3A; color:#7FE3B0; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .flag{ color:#FFB4A9; }

  /* video popup */
  .vmodal{ position:absolute; inset:0; z-index:60; background:rgba(4,10,20,.88); display:flex; align-items:center; justify-content:center; padding:16px; animation:pop .2s both; }
  .vbox{ position:relative; width:100%; background:#000; border-radius:14px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .vframe{ position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden; }
  .vframe #yt-player, .vframe iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }

  { id:"family", label:"Can I take my family?", keywords:["family","spouse","husband","wife","kids","children","married","reunification","bring my","parents"],

  { id:"pr",     label:"Can I settle there?", keywords:["pr","permanent","citizenship","settle","stay permanently","green card","residency","future"],

  { id:"cities", label:"Which city?", keywords:["city","cities","where in germany","location","hospital","which state","berlin","munich"],

    a:"You can start the German classes right away. The actual move happens once you reach B2 and finish recognition and visa, usually in about a year, depending on your pace." },
  { id:"other",  label:"What about USA/UK?", keywords:["usa","us","america","canada","uk","england","australia","ireland","dubai","gulf","saudi","other country","abroad"],

  { id:"why",    label:"Why Germany?", keywords:["why germany","norcet","plan b","better than","instead of","government job","vacancy","worth it","sarkari"],

  { id:"time",   label:"How long does it take?", keywords:["how long","duration","time","months","how many months","take","kitna time"],

  { id:"salary", label:"Salary in Germany?", keywords:["salary","earn","pay","income","money","package","how much do nurses","lakh","per month","kitna"],

  { id:"visaprocess", label:"", keywords:["visa process","visa steps","how to get visa","apply visa","visa procedure","visa kaise","get a visa"],

  { id:"relocation", label:"", keywords:["relocation","shifting","move cost","settling cost","initial expense","one time cost","extra cost"],

  { id:"insurance", label:"", keywords:["insurance","health insurance","medical cover","health cover","travel insurance","bima"],

  { id:"pcc", label:"", keywords:["police clearance","pcc","police verification","background check","character certificate"],
    a:"Yes, most countries ask for a Police Clearance Certificate (PCC) for the visa. It is a simple document from your passport office / local police. Nothing to arrange now — the counsellor tells you exactly when and how." },
  { id:"medical", label:"", keywords:["medical test","medical checkup","vaccination","health checkup","fitness certificate","medical fitness","vaccine"],
    a:"A basic medical fitness check and standard vaccinations are usually needed before joining. It is routine, and the counsellor gives you the checklist at the right stage." },
  { id:"funds", label:"", keywords:["funds","money to show","blocked account","sperrkonto","bank balance","proof of funds","savings needed","show money"],

  { id:"exams_other", label:"", keywords:["nclex","oet","cbt","osce","prometric","dha","haad","moh","ahpra","nmc","nmbi","nnas","which exam"],
    a:"Each country has its own exam: UK/Ireland need IELTS/OET + registration (NMC/NMBI), Canada needs IELTS + NNAS + a licensing exam, Australia needs IELTS/OET + AHPRA, the Gulf needs a Prometric exam. Germany needs none of these — just German up to B2. That is a big reason it is the easiest path. 🇩🇪" },
  { id:"spousework", label:"", keywords:["spouse work","wife work","husband work","partner job","can my wife work","dependent work","family work"],

  { id:"anerkennung", label:"", keywords:["anerkennung","recognition process","recognise degree","recognize degree","equivalence","gutachten","degree recognition"],
    a:"Anerkennung is Germany's process that recognises your Indian nursing degree as equal to a German one. You submit your degree, transcripts and registration to a German authority. If they see small gaps, you close them with a short knowledge test or a brief adaptation period. We prepare you for all of it." },
  { id:"kenntnis", label:"", keywords:["kenntnisprufung","kenntnis","knowledge test","adaptation","anpassung","defizit","deficit","bridge course"],
    a:"If the authority sees small gaps (a Defizitbescheid), you clear them either with a Kenntnisprüfung (a practical/oral knowledge exam) or an Anpassungslehrgang (a short adaptation period at a hospital). It is very manageable, and we prepare you for it." },
  { id:"germanvisatype", label:"", keywords:["which visa germany","visa type germany","blue card","recognition visa","work visa germany","germany work permit"],
    a:"For Germany, nurses usually travel on a recognition/skilled-worker work visa and can later hold an EU Blue Card. Once your B2 German, recognition and job offer are ready, the recruiter and employer support the visa. Your counsellor maps the exact type for you." },
  { id:"germanhealth", label:"", keywords:["german health insurance","krankenversicherung","health insurance germany","medical germany"],
    a:"In Germany health insurance is mandatory and automatic with your job — it comes out of your salary and covers doctor visits, hospital and often your family. You are well protected from day one." },
  { id:"pflege", label:"", keywords:["pflegefachkraft","registered nurse germany","nurse title","license germany","nursing license","registration germany"],
    a:"After recognition you work as a Pflegefachkraft — a fully registered nurse in Germany, with the same rights and pay as a local nurse. That recognition is the key that unlocks the full salary and the PR path." },
  { id:"germansteps", label:"", keywords:["germany process","germany steps","full process germany","roadmap germany","step by step germany","germany plan"],

  { id:"settling", label:"", keywords:["settle in germany","integration","adjust","culture shock","new country","first days","language barrier","lonely"],
    a:"You will not be alone. With B2 German you can handle daily life comfortably, and hospitals and recruiters help with your first accommodation and paperwork. A large Indian nurse community is already there, so you land among friends." },

  b2done:"वाह, बढ़िया! अगर आपके पास पहले से B2 German है, तो आप तो अगले step के लिए ready हैं! मैं सीधे अपने counsellor से connect करवा देती हूँ, वो आपकी profile fast-track कर देंगे। बस phone पास रखिए!",
  emi:"बिल्कुल! Student loan मिल जाता है जो पूरी fees पहले भर देता है, और आप छोटी-छोटी monthly EMI में चुकाते हैं। एकसाथ बड़ा payment नहीं करना पड़ता। Counsellor call पर exact amount बता देंगे।",
  levels:"German hospitals को आमतौर पर B1–B2 level चाहिए होता है। हमारा course आपको A1 से B2 तक पहुँचाता है — बिल्कुल उतना, जितना उन्हें चाहिए।",
  anm:"अगर आपके पास GNM या B.Sc Nursing (या Post-Basic B.Sc) है, तो आप शुरू कर सकते हैं। Final year students भी अभी classes शुरू कर सकते हैं। सिर्फ़ ANM आमतौर पर काफ़ी नहीं होता — पर आप अपनी detail बताइए, हम सही रास्ता बता देंगे।",
  exp:"Freshers का पूरा welcome है! सालों का experience ज़रूरी नहीं। नए और experienced, दोनों तरह के nurses यह रास्ता चुनते हैं। बस nursing degree और B2 German चाहिए।",
  age:"कोई सख़्त age limit नहीं है। हर उम्र के nurses Germany जाते हैं। हाँ, कम उम्र वाले language थोड़ा जल्दी पकड़ लेते हैं, पर आपके लिए भी रास्ता खुला है। Counsellor आपकी age के हिसाब से बता देंगे।",
  ielts:"Germany के लिए IELTS या कोई English test नहीं चाहिए! यहाँ बस German चलती है (B2 तक), और वही तो हम सिखाते हैं।",
  recog:"आपकी Indian nursing degree Germany में Anerkennung (recognition) से accept होती है — यह licensed German partners के साथ होता है, एक बार आपकी German ready हो जाए। हम आपको इसके लिए पूरा तैयार करते हैं।",
  visa:"Germany में qualified nurses के लिए special work visa है (और skilled लोगों के लिए EU Blue Card भी)। एक बार आपकी B2 German और degree recognition हो जाए, हम आपको licensed German recruiters से connect कर देते हैं जो job offer और visa आगे बढ़ाते हैं। Counsellor पूरे steps बता देंगे।",
  family:"हाँ बिल्कुल, family ले जा सकते हैं! Work visa पर settle होने के बाद आप अपने husband/wife और बच्चों को बुला सकते हैं। Counsellor timing और papers समझा देंगे।",
  pr:"Germany की nursing job लंबे समय के stay और आगे चलकर PR, फिर citizenship तक ले जा सकती है — क्योंकि वहाँ nurses की हमेशा ज़रूरत रहती है। Counsellor पूरा रास्ता बता देंगे।",
  tax:"Germany की salary tax से पहले की होती है। Tax के बाद भी अच्छी रकम बचती है, और health cover + pension साथ में मिलते हैं। असल in-hand आपके tax class पर depend करता है — counsellor सही अंदाज़ा दे देंगे।",
  docs:"Germany के लिए आमतौर पर चाहिए: passport, nursing degree और marksheets, Indian nursing council registration, आपका B2 German certificate, और recognition (Anerkennung) के papers, साथ में job offer। अभी शुरू करने के लिए कुछ नहीं चाहिए — counsellor पूरी list दे देंगे।",
  cities:"Indian nurses Germany के कई cities और hospitals में काम करते हैं। City उस hospital पर depend करती है जो आपको hire करता है, और आपकी पसंद का भी ध्यान रखा जाता है।",
  stay:"जब आप जाते हैं, hospital और recruiters आमतौर पर शुरू की accommodation और settle होने में help करते हैं। आप अकेले नहीं होंगे।",
  male:"हाँ बिल्कुल, Germany में male nurses की भी उतनी ही ज़रूरत है — रास्ता एकदम same है।",

  process:"बहुत simple है! पहले हमारे साथ A1 से B2 German सीखिए। दूसरा, अपनी degree की recognition (Anerkennung) कराइए। तीसरा, हम आपको licensed German recruiters से connect कर देते हैं जो job, visa और joining कराते हैं। Counsellor हर step guide करेंगे।",
  when:"German classes आप अभी शुरू कर सकते हैं! Germany जाना तब होता है जब B2 पूरा हो जाए और recognition + visa हो जाए — आमतौर पर लगभग एक साल में, आपकी speed पर depend करता है।",
  other:"अभी हम पूरा focus Germany पर रखते हैं — क्योंकि वहाँ nurses की सबसे ज़्यादा कमी है, salary अच्छी है, और Indian nurses के लिए साफ़ legal रास्ता है। चाहें तो counsellor call पर बाकी options भी बता देंगे।",

  time:"A1 से B2 तक जाने में आमतौर पर 10 से 12 महीने लगते हैं — आपकी सीखने की speed पर depend करता है। Counsellor आपके लिए एक clear timeline बना देंगे।",
  salary:"Germany में nurses लगभग ₹2 से 2.5 लाख महीना कमाते हैं (hospital और city से थोड़ा ऊपर-नीचे होता है), जबकि India में staff nurse को करीब ₹25,000। ऊपर से अच्छे benefits और paid leave भी।",

  cost:"अच्छा सवाल! Exact fee तो counsellor आपको call पर पूरी detail के साथ बता देंगे — easy EMI options और कोई hidden charge नहीं। हम सिर्फ़ language training + interview prep का charge लेते हैं (referral के लिए कुछ नहीं), और शुरू करने के लिए अभी कुछ देना नहीं है।",

  guarantee:"हम आपकी तैयारी इतनी अच्छी कराते हैं कि आप एक strong, ready candidate बन जाते हैं। Final hiring German recruiters और hospitals करते हैं, और वहाँ nurses की भारी कमी की वजह से demand बहुत ज़्यादा है। Counsellor पूरा रास्ता साफ़-साफ़ बता देंगे।",
  legit:"अच्छा सवाल! Testbook Global आपको German में train करता है, पूरा ready कराता है, और licensed German recruiters से connect करता है जो hiring करते हैं। यह एक सही, legal और भरोसेमंद रास्ता है — कोई झूठे वादे करने वाला agent नहीं। Counsellor call पर सब कुछ दिखा देंगे।",

  howru:"मैं बढ़िया हूँ, पूछने के लिए शुक्रिया! आपको Germany में ₹2–2.5 लाख/महीना वाली nursing career दिलाने में मदद करके खुशी होगी। चलिए quickly check करें आप qualify करती हैं?",
  bye:"अपना ख़याल रखिए! हमारे counsellor जल्दी आपको सब जानकारी के साथ call करेंगे। All the best!",
  visaprocess:"Visa तो आख़िर में आता है, जब आप ready हो जाते हैं। Short में: (1) ज़रूरी language/exam पूरा करें, (2) nursing degree की recognition कराएँ, (3) licensed recruiter से job offer लें, (4) documents के साथ work visa apply करें। Germany के लिए यह skilled-worker visa या EU Blue Card होता है। Counsellor हर step बता देंगे।",
  flights:"Flight तभी book होती है जब visa और joining date fix हो जाए। India से Germany की one-way ticket आमतौर पर ₹25,000 से ₹45,000 के बीच होती है (season और city से बदलती है)। कई employers/recruiters relocation में help करते हैं — counsellor बता देंगे आपके offer में क्या मिलेगा।",
  relocation:"Language fees के अलावा कुछ one-time खर्च रखिए — flight, visa fees, documents का translation, और दिखाने के लिए थोड़ी रकम। ये ज़्यादा नहीं होते, और counsellor पूरी list दे देते हैं ताकि कोई surprise न हो।",
  insurance:"Germany में health insurance job के साथ ही आता है — salary से कटता है और पहले दिन से आपको (अक्सर family को भी) cover करता है। जाने से पहले बस short-term travel insurance चाहिए हो सकता है। Counsellor बता देंगे कब क्या करना है।",
  pcc:"हाँ, ज़्यादातर देश visa के लिए Police Clearance Certificate (PCC) माँगते हैं। यह passport office/local police से मिलने वाला आसान document है। अभी कुछ नहीं करना — counsellor सही time पर बता देंगे।",
  medical:"Joining से पहले आमतौर पर एक basic medical fitness check और normal vaccines चाहिए होते हैं। यह routine है, और counsellor सही time पर checklist दे देंगे।",
  funds:"Germany के visa के लिए एक blocked account (Sperrkonto) में कुछ funds दिखाने पड़ सकते हैं — कुछ लाख रुपये जो आपके ही रहते हैं और पहुँचने पर आप use करते हैं। Job offer हो तो requirement कम हो जाती है। Counsellor exact amount बता देंगे।",
  exams_other:"हर देश का अपना exam है: UK/Ireland के लिए IELTS/OET + registration (NMC/NMBI), Canada के लिए IELTS + NNAS + licensing exam, Australia के लिए IELTS/OET + AHPRA, Gulf के लिए Prometric। Germany के लिए इनमें से कुछ नहीं — बस B2 तक German। इसीलिए यह सबसे आसान रास्ता है। 🇩🇪",
  spousework:"हाँ — Germany में आपके life partner भी आमतौर पर काम कर सकते हैं, जब वो family visa पर आपके साथ आते हैं। कई देशों के मुक़ाबले यह बड़ा फ़ायदा है। Counsellor conditions समझा देंगे।",
  anerkennung:"Anerkennung Germany का वो process है जो आपकी Indian nursing degree को German degree के बराबर मानता है। आप अपनी degree, transcripts और registration एक German authority को देते हैं। अगर छोटे-मोटे gaps हों, तो एक छोटे knowledge test या adaptation से पूरे हो जाते हैं। हम आपको तैयार कर देते हैं।",
  kenntnis:"अगर authority को छोटे gaps दिखें (Defizitbescheid), तो आप उन्हें Kenntnisprüfung (practical/oral knowledge exam) या Anpassungslehrgang (hospital में छोटी adaptation period) से पूरा करते हैं। बहुत manageable है, और हम आपको तैयार करते हैं।",

// lead nurture score (0-100) + tier, from tracked activity
function nurtureOf(d){
  let s=0;
  if(d.phone) s+=10;
  if(d.lang) s+=8;
  if(d.nurse==="nurse"||d.nurse==="student") s+=12;
  if(d.qualification) s+=10;
  if(d.abroad==="yes") s+=12; else if(d.abroad) s+=6;
  if(d.country) s+=8;
  s += Math.min(18, ((d.qCount||0)+(d.hubN||0)+(d.gN||0))*3);
  if(d.gpushed) s+=8;
  if(d.videoStarted) s+=6;
  s += Math.round((d.videoPct||0)/10);
  if(d.videoCompleted) s+=6;
  if(d.slot) s+=12;
  s = Math.min(100, s);
  return { score:s, tier: s>=70 ? "hot" : s>=40 ? "warm" : "cold" };
}

const norm = (s)=> (s||"").toLowerCase().replace(/[^a-z0-9ऀ-ॿ ]+/g," ").replace(/\s+/g," ").trim();
const esc = (k)=> k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
// whole-word (space-bounded) match so "pr" can't match "prime", "man" can't match "German"
function matchFor(text){
  const q = " " + norm(text) + " ";
  let best=null, bestScore=0;
  KB.forEach((e)=>{
    let score=0;
    e.keywords.forEach((k)=>{ if(new RegExp(" "+esc(k)+" ").test(q)) score += k.includes(" ")?2:1; });
    if(score>bestScore){ bestScore=score; best=e; }
  });

}

/* Phone: never block. Return {ok, value, flag, display}. */
function classifyPhone(raw){
  const t = (raw||"").trim();
  const digits = t.replace(/\D/g,"");
  let local = digits, hadIN = t.startsWith("+91") || (digits.length===12 && digits.startsWith("91"));
  if(digits.length===12 && digits.startsWith("91")) local = digits.slice(2);
  else if(digits.length===11 && digits.startsWith("0")) local = digits.slice(1);
  if(/^[6-9]\d{9}$/.test(local)) return { ok:true, value:local, flag:null, display:"+91 "+local };
  // looks like a foreign number
  if((t.startsWith("+") && !hadIN) || digits.length>10) return { ok:false, value:t, flag:"non_india", display:t };
  return { ok:false, value:t, flag:"invalid", display:t };
}

  // what to say to steer back to the pending question after a side question
  const REASK = {
    lang:["Which language would you like to chat in, English or Hindi?","आप किस भाषा में बात करना चाहेंगी, English या Hindi?"],
    nurse:["Coming back to my question: are you a nurse, or studying nursing?","अपने सवाल पर वापस आती हूँ: क्या आप nurse हैं, या nursing पढ़ रही हैं?"],
    qual:["So, which nursing qualification do you have?","तो, आपकी nursing qualification क्या है?"],
    check:["Back to our nursing round, just tap your answer.","चलिए nursing round पर वापस, बस अपना answer tap कीजिए।"],
    salary:["And roughly what's your monthly salary right now? You can skip it too.","और अभी आपकी monthly salary लगभग कितनी है? चाहें तो skip भी कर सकती हैं।"],
    council:["And are you registered with a Nursing Council?","और क्या आप किसी Nursing Council में registered हैं?"],
    workplace:["So, where are you working right now? Hospital and ward is enough.","तो, आप अभी कहाँ काम कर रही हैं? Hospital और ward बता दीजिए।"],
    college:["And which college did you do your nursing from?","और आपने किस college से nursing की?"],
    notnurse:["Are you asking for someone in your family who's a nurse?","क्या आप family में किसी nurse के लिए पूछ रहे हैं?"],
    reconfirm:["Which of these describes you best?","इनमें से आप कौन हैं?"],
  };
  const MIDFLOW = new Set(Object.keys(REASK));
  const typedChip = (v)=>{
    const x = v.toLowerCase(), t = (fn)=>{ typedRef.current = v; fn(); return true; };
    // "can someone call me" wins over whatever the buttons were asking (outside the qualification steps)
    if(!MIDFLOW.has(stage) && stage!=="slot" && /(call me|call kar|call karo|can (someone|you) call|callback|call back|talk to (someone|a counsel|the counsel|counsel)|speak (to|with)|baat kar(ni|na|wa))/.test(x)){
      typedRef.current = v; me(v); askSlot(); return true; }
    const short = x.split(/\s+/).length <= 3;   // a bare "ok"/"yes" answers the buttons; longer text is a message
    switch(stage){
      case "lang": return t(()=> pickLang(/hindi|हिं|हिन्दी/.test(x) || /[ऀ-ॿ]/.test(v) ? CHAT_LANGS[1] : CHAT_LANGS[0]));
      case "nurse": {
        const q = findQual(v);
        if(/student|studying|final year|last year|internship|padh|पढ़/.test(x)) return t(()=> pickNurse({ key:"student", label:"" }, q));
        if(/not a nurse|nurse nahi|i am not|i'm not/.test(x) || (NO_RX.test(x) && !q)) return t(()=> pickNurse({ key:"no", label:"" }));
        if(YES_RX.test(x) || /nurse|staff|नर्स/.test(x) || q) return t(()=> pickNurse({ key:"nurse", label:"" }, q));
        return false; }
      case "qual": { const q = findQual(v); return q ? t(()=> pickQual(q)) : false; }
      case "check": {
        const c = (lead.checkQs||[])[lead.checkIdx||0]; if(!c) return false; const d = checkDef(c.id);
        if(/not sure|don'?t know|dont know|pata nahi|idk|no idea|पता नहीं/.test(x)) return t(()=> answerCheck(-1));
        const nx = norm(v);
        const hit = d.opts.findIndex(o=>{ const a = norm(o.en), b = norm(o.hi); return nx && (nx===a || nx===b || (nx.length>3 && (a.includes(nx) || nx.includes(a) || b.includes(nx)))); });
        if(hit >= 0) return t(()=> answerCheck(hit));
        const num = nx.match(/\d+/); if(num){ const h2 = d.opts.findIndex(o=> o.en.split(/\D+/).includes(num[0])); if(h2 >= 0) return t(()=> answerCheck(h2)); }
        return false; }
      case "salary": { const k = parseSalary(v); return k ? t(()=> pickSalary(SALARY_OPTS.find(o=>o.key===k))) : false; }
      case "council": {
        if(/(not a nurse|just exploring)/.test(x)) return t(()=> pickCouncil({ key:"none", label:"" }));
        if(/(final year|not yet|applied|pending|in process|abhi nahi|studying)/.test(x)) return t(()=> pickCouncil({ key:"studying", label:"" }));
        if(!NO_RX.test(x) && /(state|\binc\b|indian nursing|registered|registration|council|\d{3,})/.test(x) || YES_RX.test(x)) return t(()=> pickCouncil({ key:"registered", label:"" }));
        return false; }
      case "country": {
        if(/not sure|don'?t know|pata nahi|decide/.test(x)) return t(()=> pickCountry("none"));
        const k = Object.keys(COUNTRY_WORDS).find(k2=> COUNTRY_WORDS[k2].test(x));
        return k && !isQuestion(v) ? t(()=> pickCountry(k)) : false; }
      case "notnurse":
        if(/(daughter|son|wife|husband|sister|brother|beti|behen|bahu|family|friend|cousin|niece)/.test(x) || YES_RX.test(x)) return t(()=> pickNotNurse(true));
        if(NO_RX.test(x) || /explor|just looking|dekh/.test(x)) return t(()=> pickNotNurse(false));
        return false;
      case "reconfirm":
        if(/(daughter|wife|sister|beti|behen|family|for my|asking for)/.test(x)) return t(()=> pickReconfirm("proxy", v));
        if(/(student|final year)/.test(x)) return t(()=> pickReconfirm("student", v));
        if(/(not a nurse|i am not|i'm not|nahi hu|nahin hu)/.test(x) || NO_RX.test(x)) return t(()=> pickReconfirm("no", v));
        if(/(nurse|gnm|bsc|b\.sc|qualified)/.test(x) || YES_RX.test(x)) return t(()=> pickReconfirm("nurse", v));
        return false;
      case "gpush":
        if((short && YES_RX.test(x)) || /tell|bata|show/.test(x)) return t(()=> pickGpush(true));
        if(NO_RX.test(x) || /later|baad/.test(x)) return t(()=> pickGpush(false));
        return false;
      case "video_lang":
        if(/hindi|हिं/.test(x)) return t(()=> playVideoLang("Hindi"));
        if(/english/.test(x) || (short && YES_RX.test(x))) return t(()=> playVideoLang("English"));
        if(/short|bata|tell|no video|nahi|no\b/.test(x)) return t(()=> skipVideo());
        return false;
      case "video_feedback":
        if(/(didn'?t|confus|samajh nahi|not clear|nahi samjha)/.test(x)) return t(()=> vidFeedback("confused"));
        if(/(loved|love|good|great|nice|accha|achha|badhiya|helpful|amazing)/.test(x)) return t(()=> vidFeedback("good"));
        return false;
      case "nudge":
        if(/(call|book)/.test(x)) { typedRef.current = v; me(v); askSlot(); return true; }
        if((short && YES_RX.test(x)) || /more|tell/.test(x)) { typedRef.current = v; me(v); setStage(lead.gpushed ? "ghub" : "hub"); say(M("Ask me anything!","कुछ भी पूछिए!")); return true; }
        return false;
      case "book_offer":
        if((short && YES_RX.test(x)) || /book|call/.test(x)) { typedRef.current = v; me(v); askSlot(); return true; }
        if(NO_RX.test(x) || /later|baad/.test(x)) { typedRef.current = v; me(v); say(M("Sure! Ask me anything else.","ज़रूर! और कुछ भी पूछिए।")); setStage(lead.gpushed ? "ghub" : "hub"); return true; }
        return false;
      case "slot": { if(isQuestion(v)) return false; const sl = parseSlot(v, SLOTS); if(!sl) return false; typedRef.current = v; me(v); finish(sl); return true; }
      default: return false;
    }
  };
  // a question typed in the middle of the qualification steps: answer it, then pick the thread back up
  const sideAnswer = async (v)=>{
    me(v); setInput(""); scanText(v);
    setLead((l)=>({ ...l, qCount:(l.qCount||0)+1, qList:[...(l.qList||[]).slice(-14), { q:v, topic:"side", at:new Date().toISOString() }] }));
    const back = REASK[stage];
    const e = matchFor(v);
    if(e && CASUAL_IDS.has(e.id) && norm(v).split(" ").length<=4){ say(A(e)); if(back) say(M(back[0], back[1])); return; }
    let j = null;
    if(CONFIG.LLM_ENDPOINT && (lead.llmN||0) < CONFIG.LLM_MAX_PER_SESSION){ busyRef.current = true; setTyping(true); const t0 = Date.now(); j = await askLLM(v); busyRef.current = false;
      if(j){ say(j.reply, { elapsed: Date.now()-t0 }); setLead((l)=>({ ...l, llmN:(l.llmN||0)+1 })); } }
    if(!j){ setTyping(false); say(M("Good question, and I'll make sure you get a proper answer on that. Let me just finish your quick eligibility check first.","अच्छा सवाल है, इसका सही जवाब ज़रूर मिलेगा। बस पहले आपका छोटा-सा eligibility check पूरा कर लेती हूँ।")); }
    if(back) say(M(back[0], back[1]));
  };
  const didntGetIt = (v)=>{
    me(v); setInput("");
    const back = REASK[stage] || ["Could you tap one of the options?","क्या आप कोई option tap कर सकती हैं?"];
    const lead0 = [["Sorry, I didn't quite catch that.","माफ़ कीजिए, मैं ठीक से समझ नहीं पाई।"],["Hmm, I'm not sure I got that.","हम्म, मैं ठीक से समझी नहीं।"]][Math.floor(Math.random()*2)];
    say(M(lead0[0]+" "+back[0], lead0[1]+" "+back[1]));
  };

  const askSlot = ()=>{
    if(lead.verifyVerdict==="not_nurse" || (lead.nurse==="no" && !lead.proxy)){
      say(M("Our counsellor calls are only for nurses and nursing students, so I can't book one here — but I'm happy to answer anything you'd like to know!","हमारी counsellor calls सिर्फ़ nurses और nursing students के लिए हैं, इसलिए मैं यहाँ book नहीं कर सकती — पर जो भी जानना हो, खुशी से बताऊँगी!"));
      setStage(lead.gpushed ? "ghub" : "hub"); return;
    }
    say(M("Of course! When would be a good time for our counsellor to call you?","ज़रूर! Counsellor आपको किस समय call करें?")); setStage("slot"); };
  // Camera icon → opens the demo German class on its own full screen (a video-call style screen)
  const openDemo = ()=>{
    setMenuOpen(false);
    setDemoView("ask");   // always verify they're a nurse first; only then unlock the booking button
    setPhase("videocall");
  };
  const openProfile = ()=>{ setMenuOpen(false); setPhase("profile"); };
  const closeProfile = ()=> setPhase("chat");
  const closeDemo = ()=> setPhase("chat");
  const demoAnswer = (o)=>{
    setLead((l)=>({ ...l, nurse:o.key }));
    if(o.key==="no"){
      setLead((l)=>({ ...l, nurseConfidence:"low", leadQuality:"unlikely" }));
      setDemoView("no");
    } else {
      setDemoView("ok");
    }
  };
  const callCounsellor = ()=>{
    me(M("Call counsellor","Counsellor से बात"));
    if(lead.council){ askSlot(); return; }
    bookRef.current = true;
    say(M("Love it! Quick check so our counsellor can help you best — are you a nurse, or studying nursing? 👇","बढ़िया! बस एक quick check ताकि counsellor सही मदद कर सकें — क्या आप nurse हैं, या nursing पढ़ रही हैं? 👇"), 500);
    queueStage("nurse");
  };
  const nudgeExit = ()=>{
    if(lead.nudged){ askSlot(); return; }
    setLead((l)=>({ ...l, nudged:true }));
    say(M("Wait — before you go! Most nurses don't realise Germany needs NO IELTS, pays ₹2–2.5 lakh/month, and your family can join you. Can I do a quick free eligibility check for you?",
          "रुकिए — जाने से पहले ज़्यादातर nurses को नहीं पता कि Germany में IELTS नहीं चाहिए, ₹2–2.5 लाख/महीना मिलता है, और family साथ आ सकती है। क्या मैं एक quick free eligibility check कर दूँ?"), 650);
    queueStage("nudge");
  };
  const finish = (slot)=>{
    const s = slot || lead.slot || null;
    const f = { ...lead, slot:s, booked:true };
    setLead(f); submitLead(f, "completed");
    say(M(`You are all set, ${(lead.name||"there").split(" ")[0]}! Our counsellor will call you${s ? " in your "+s+" slot" : " soon"}. Keep your phone handy, okay?`,
          `सब set है, ${(lead.name||"").split(" ")[0]}! हमारे counsellor आपको${s ? " आपके "+s+" slot में" : " जल्दी"} call करेंगे। बस phone पास रखिए!`));
    // DON'T end the chat — keep it alive and keep nurturing while they wait for the call
    setTimeout(()=> say(M("While you wait for the call, I'm right here. Want me to show what nurses earn in Germany, the step-by-step process, or the cost & easy EMI? Ask me anything 👇",
                          "Call का इंतज़ार करते हुए मैं यहीं हूँ। बताऊँ कि Germany में nurses कितना कमाते हैं, पूरा step-by-step process, या cost & easy EMI? कुछ भी पूछिए 👇"), 950), 1600);
    setStage(lead.gpushed ? "ghub" : "hub");
  };

  const onKey = (e)=>{ if(e.key!=="Enter") return; sendClick(); };
  const sendClick = ()=>{
    const v = input.trim(); if(!v || busyRef.current) return;
    if(stage==="name") return saveName();
    if(stage==="phone") return savePhone();
    // a question typed where we expect a hospital / college name: answer it instead of saving it as the answer
    if(stage==="workplace" && isQuestion(v) && !validateWorkplace(v)) return sideAnswer(v);
    if(stage==="college" && isQuestion(v) && !validateCollege(v)) return sideAnswer(v);
    if(stage==="workplace") return saveWorkplace();
    if(stage==="specialization") return saveSpecialization();
    if(stage==="college") return saveCollege();
    if(stage==="researched") return saveResearched();
    if(typedChip(v)){ setInput(""); return; }
    if(MIDFLOW.has(stage)) return isQuestion(v) ? sideAnswer(v) : didntGetIt(v);
    return handleFreeText();
  };

  // the text box is always there (like WhatsApp): buttons are a shortcut, typing always works
  const showInput = !["greet","start","done","checkwait"].includes(stage);
  const placeholder = stage==="name" ? "Type your name" : stage==="phone" ? "Your mobile number" : stage==="workplace" ? M("Hospital name, ward…","Hospital का नाम, ward…") : stage==="specialization" ? M("Type your specialization","अपनी specialization type करें") : stage==="college" ? M("Type your college name","अपने college का नाम type करें") : stage==="researched" ? M("Type what you've found…","जो पता चला, type कीजिए…") : MIDFLOW.has(stage) || ["country","slot","gpush","video_lang","video_feedback","book_offer","nudge"].includes(stage) ? M("Tap an option or type…","Option चुनें या type करें…") : M("Ask Jhanvi anything","झांवी से कुछ भी पूछें");

  // show Jhanvi's face only on the last bot message of a run
  const lastBot = (i)=> msgs[i].from==="bot" && (!msgs[i+1] || msgs[i+1].from!=="bot") && !typing;

  return (
    <div className="phone">

      {phase==="welcome" && (
        <div className="welcome">
          <div className="wlogo" aria-label="Testbook">
            <svg className="wlogo-mark" viewBox="0 0 44 38" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M3 11 L21 6 L21 33 L3 30 Z" fill="#20CBE6"/>
              <path d="M39 11 L21 6 L21 33 L39 30 Z" fill="#12182A"/>
            </svg>
            <span className="wlogo-word">testbook</span>
          </div>
          <div className="wava"><img src={AVATAR} alt="Jhanvi" /><span className="wonline"></span></div>
          <h2>Chat with Jhanvi</h2>
          <p className="wrole"><span className="dot"></span> Testbook Global · Germany Nursing</p>
          <p className="sub">Earn <span className="hl">₹2–2.5 lakh/month</span> as a nurse in Germany — no IELTS. Share your details for a free eligibility check. 👩‍⚕️🇩🇪</p>
          <div className="card2">
            <div className="field"><input value={wname} onChange={(e)=>setWname(e.target.value)} placeholder="Your full name" maxLength={60} autoFocus /></div>
            <div className="field phonewrap">
              <span className="cc">+91</span>
              <input value={wphone} onChange={(e)=>setWphone(e.target.value.replace(/[^0-9]/g,""))} onKeyDown={(e)=>e.key==="Enter"&&submitWelcome()} inputMode="numeric" maxLength={10} placeholder="10-digit mobile number" style={{ flex:1 }} />
            </div>
            <div className="werr">{werr}</div>
            <button className="go" onClick={submitWelcome} disabled={!wname.trim() || wphone.length<10}>Start chat <span>→</span></button>
          </div>
          <div className="wtiny">🔒 100% private · 💬 We reply instantly</div>
        </div>
      )}

      {phase==="videocall" && (
        <div className="vcall">
          <div className="vc-top">
            <span className="vc-back" onClick={closeDemo}>‹</span>
            <div className="vc-ttl">
              <div className="vc-ttl-main">{M("Demo German Class","डेमो German Class")}</div>
              <div className="vc-ttl-sub"><span className="vc-live"></span> {M("Live with Jhanvi","Jhanvi के साथ Live")}</div>
            </div>
            <span className="vc-x" onClick={closeDemo}>✕</span>
          </div>

          <div className="vc-stage">
            <div className="vc-tile">
              <img src={AVATAR} alt="Jhanvi" />
              <div className="vc-badge"><span className="vc-live"></span> {M("Jhanvi · Testbook Global","Jhanvi · Testbook Global")}</div>
            </div>
            <div className="vc-pip">{(wname||lead.name||"You").trim().charAt(0).toUpperCase()}</div>
          </div>

          <div className="vc-sheet">
            {demoView==="ask" && (<React.Fragment>
              <p className="vc-q">{M("🎬 This is a FREE live demo German class with Jhanvi ma'am — you pick a date & time that suits you, and join her live online. It's specially for nurses heading to Germany, so one quick check 👇","🎬 यह Jhanvi ma'am के साथ एक FREE live demo German class है — अपनी सुविधा का date & time चुनकर उनके साथ live online join कीजिए। यह ख़ास nurses के लिए है, तो एक quick check 👇")}</p>
              <p className="vc-q2">{M("Are you a nurse, or a nursing student?","क्या आप nurse हैं, या nursing student?")}</p>
              <div className="vc-opts">
                {[{key:"nurse",label:M("Yes, I am a nurse","हाँ, मैं nurse हूँ")},{key:"student",label:M("Nursing student","Nursing student")},{key:"no",label:M("No, I'm not a nurse","नहीं, मैं nurse नहीं हूँ")}].map((o)=>
                  <button key={o.key} className="vc-btn" onClick={()=>demoAnswer(o)}>{o.label}</button>)}
              </div>
            </React.Fragment>)}

            {demoView==="ok" && (<React.Fragment>
              <p className="vc-q">{M("Perfect — you qualify! Tap below to open the booking page, pick a date & time that works for you, and confirm your slot for the free live demo German class with Jhanvi ma'am. After booking, just tap your phone's back button to come right back to this chat 👇","बढ़िया — आप qualify करती हैं! नीचे tap करके booking page खोलिए, अपनी सुविधा का date & time चुनकर Jhanvi ma'am के साथ free live demo German class का slot confirm कर लें। Book करने के बाद बस phone का back button दबाकर वापस इसी chat पर आ जाइए 👇")}</p>
              <div className="vc-opts">
                <button className="vc-btn vc-cta" onClick={()=>{ window.location.href = CONFIG.DEMO_CLASS_URL; }}>🎬 {M("Book my free demo class","Free demo class book करें")}</button>
                <button className="vc-btn vc-ghost" onClick={closeDemo}>{M("‹ Back to chat","‹ चैट पर वापस")}</button>
              </div>
            </React.Fragment>)}

            {demoView==="no" && (<React.Fragment>
              <p className="vc-q">{M("Thanks for being honest! This live demo class is designed only for nurses, so it wouldn't be the right fit right now. But I'm happy to help with general info about careers abroad — just head back to the chat and ask me anything! 🌍","आपकी ईमानदारी के लिए शुक्रिया! यह live demo class सिर्फ़ nurses के लिए है, तो अभी सही नहीं रहेगी। पर विदेश में career की general जानकारी में मैं खुशी से मदद करूँगी — chat पर वापस जाकर कुछ भी पूछिए! 🌍")}</p>
              <div className="vc-opts">
                <button className="vc-btn vc-cta" onClick={closeDemo}>{M("Back to chat","चैट पर वापस")}</button>
              </div>
            </React.Fragment>)}
          </div>
        </div>
      )}


      {phase==="profile" && (
        <div className="profile">
          <div className="pf-top">
            <span className="pf-back" onClick={closeProfile}>‹</span>
            <span className="pf-ttl">{M("Contact info","Contact info")}</span>
          </div>
          <div className="pf-hero">
            <img src={AVATAR} alt="Jhanvi Bhasin" />
            <h2>Jhanvi Bhasin</h2>
            <p className="pf-role">German Language Educator</p>
            <p className="pf-sub">{M("Helping nurses become job-ready in Germany 🇩🇪","Nurses को Germany के लिए job-ready बनाती हूँ 🇩🇪")}</p>
            <span className="pf-online"><span className="dot"></span> {M("online","online")}</span>
          </div>
          <div className="pf-actions">
            <button className="pf-call" onClick={()=>{ window.location.href = CONFIG.DEMO_CLASS_URL; }}>{M("Book a call now","अभी call book करें")}</button>
            <button className="pf-back-btn" onClick={closeProfile}>{M("‹ Back to chat","‹ चैट पर वापस")}</button>
          </div>
        </div>
      )}

      {phase==="chat" && (<React.Fragment>
      <div className="hdr">
        <div className="hdr-top">
          <span className="hdr-back">‹</span>
          <div className="avatar" onClick={openProfile} style={{cursor:"pointer"}}><Jhanvi/></div>
          <div style={{ flex:1, minWidth:0, cursor:"pointer" }} onClick={openProfile}>
            <h1>Jhanvi</h1>
            <div className="sub">{typing ? "typing…" : (<React.Fragment><span className="dot"></span> online</React.Fragment>)}</div>
          </div>
          <div className="hdr-icons">
            <span className="hdr-cam" onClick={openDemo} title="Free demo German class" aria-label="Free demo German class">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#075e54" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><rect x="2.5" y="6.5" width="12.5" height="11" rx="2.2"/><path d="M15 10.2l6-3v9.6l-6-3"/></svg>
            </span>
            <span onClick={()=>setMenuOpen(v=>!v)} style={{cursor:"pointer",userSelect:"none",padding:"0 4px",fontSize:"20px"}}>⋮</span>
          </div>
        </div>
      </div>

      {menuOpen && (
        <React.Fragment>
          <div className="hmenu-bd" onClick={()=>setMenuOpen(false)}></div>
          <div className="hmenu">
            <button className="hmenu-item" onClick={()=>{ setMenuOpen(false); callCounsellor(); }}>📞 {M("Call counsellor","Counsellor से बात करें")}</button>
            <button className="hmenu-item" onClick={()=>{ setMenuOpen(false); window.open("https://globalcareers.testbook.com","_blank"); }}>🌐 {M("Visit website","Website देखें")}</button>
            <button className="hmenu-item" onClick={()=>{ setMenuOpen(false); window.open("https://www.instagram.com/globalcareersbytestbook/","_blank"); }}>📸 Instagram</button>
          </div>
        </React.Fragment>
      )}
      <div className="canvas">
        {msgs.map((m,i)=> m.card==="salary"
          ? <SalaryCard key={i} />
          : m.card==="compare"
          ? <CompareCard key={i} sel={m.sel} lang={LANG} />
          : <Group key={i} from={m.from} at={m.at}>{m.node}</Group>)}
        {typing && <Typing/>}
        {stage==="start" && !typing && (
          <div className="grp bot"><div className="mini hide"></div>
            <button className="chip cta" onClick={begin}>Yes, help me →</button>
          </div>
        )}
        {stage==="lang" && (
          <div className="opts">
            {CHAT_LANGS.map((o)=>
              <button key={o.code} className="opt" onClick={()=>pickLang(o)}>{o.label}</button>)}
          </div>
        )}

        {stage==="nurse" && (
          <div className="opts one">
            {[{key:"nurse",label:M("Yes, I am a nurse","हाँ, मैं nurse हूँ")},{key:"student",label:M("Final-year student","Final year student")},{key:"no",label:M("No","नहीं")}].map((o)=>
              <button key={o.key} className="opt" onClick={()=>pickNurse(o)}>{o.label}</button>)}
          </div>
        )}

        {stage==="qual" && (
          <div className="opts">
            {["GNM","B.Sc Nursing","Post Basic B.Sc","ANM"].map((o)=>
              <button key={o} className="opt" onClick={()=>pickQual(o)}>{o}</button>)}
          </div>
        )}

        {stage==="salary" && (
          <div className="opts">
            {SALARY_OPTS.map((o)=>
              <button key={o.key} className="opt" onClick={()=>pickSalary(o)}>{o.label}</button>)}
          </div>
        )}

        {stage==="check" && (()=>{ const c=(lead.checkQs||[])[lead.checkIdx||0]; if(!c) return null; const d=checkDef(c.id); return (
          <div className="opts one">
            {c.order.map((i)=> <button key={i} className="opt" onClick={()=>answerCheck(i)}>{M(d.opts[i].en,d.opts[i].hi)}</button>)}
            <button className="opt" onClick={()=>answerCheck(-1)}>{M("Not sure","पता नहीं")}</button>
          </div>); })()}

        {stage==="notnurse" && (
          <div className="opts one">
            <button className="opt" onClick={()=>pickNotNurse(true)}>{M("Yes, for a family member","हाँ, family member के लिए")}</button>
            <button className="opt" onClick={()=>pickNotNurse(false)}>{M("No, just exploring","नहीं, बस देख रहा/रही हूँ")}</button>
          </div>
        )}

        {stage==="reconfirm" && (
          <div className="opts one">
            {[{k:"nurse",l:M("I'm a qualified nurse (GNM / B.Sc)","मैं qualified nurse हूँ (GNM / B.Sc)")},{k:"student",l:M("I'm a final-year nursing student","मैं final-year nursing student हूँ")},
              {k:"proxy",l:M("Asking for a family member","Family member के लिए पूछ रहा/रही हूँ")},{k:"no",l:M("I'm not a nurse","मैं nurse नहीं हूँ")}].map((o)=>
              <button key={o.k} className="opt" onClick={()=>pickReconfirm(o.k, o.l)}>{o.l}</button>)}
          </div>
        )}

        {stage==="book_offer" && (
          <div className="opts">
            <button className="opt" onClick={()=>{ me(M("Yes, book my free call","हाँ, free call book करें")); askSlot(); }}>{M("📞 Yes, book my free call","📞 हाँ, free call book करें")}</button>
            <button className="opt" onClick={()=>{ me(M("Not right now","अभी नहीं")); say(M("Sure! Ask me anything else 👇","ज़रूर! और कुछ भी पूछिए 👇"), 500); setStage(lead.gpushed ? "ghub" : "hub"); }}>{M("Not right now","अभी नहीं")}</button>
          </div>
        )}

        {stage==="council" && (
          <div className="opts">
            {[{key:"registered",label:M("Indian Nursing Council","Indian Nursing Council")},
              {key:"registered",label:M("My State Nursing Council","मेरी State Nursing Council")},
              {key:"studying",label:M("Final year — not registered yet","Final year — अभी registered नहीं")},
              {key:"none",label:M("Not a nurse / just exploring","Nurse नहीं / बस देख रही हूँ"),full:true}].map((o,i)=>
              <button key={i} className={"opt"+(o.full?" full":"")} onClick={()=>pickCouncil(o)}>{o.label}</button>)}
          </div>
        )}

        {stage==="abroad" && (
          <div className="opts one">
            {[{key:"yes",label:M("Yes, actively","हाँ, ज़रूर")},{key:"explore",label:M("Just exploring","बस देख रही हूँ")},{key:"unsure",label:M("Not sure yet","अभी तय नहीं")}].map((o)=>
              <button key={o.key} className="opt" onClick={()=>pickAbroad(o)}>{o.label}</button>)}
          </div>
        )}

        {stage==="country" && (
          <div className="opts">
            {COUNTRIES.map((c)=>
              <button key={c.k} className="opt" onClick={()=>pickCountry(c.k)}>{c.flag} {M(c.name.en,c.name.hi)}</button>)}
            <button className="opt full" onClick={()=>pickCountry("none")}>{M("Not sure yet","अभी तय नहीं")}</button>
          </div>
        )}

        {stage==="compare_pick" && (
          <div className="opts">
            <div className="cmp-pick">
              {COUNTRIES.map((c)=>{
                const on = cmpSel.includes(c.k); const locked = c.k==="germany";
                const full = cmpSel.length>=3 && !on;
                return (
                  <button key={c.k} className={"cmp-chip"+(on?" on":"")+(locked?" lock":"")} onClick={()=>toggleCmp(c.k)} disabled={locked||full}>
                    <span>{c.flag} {M(c.name.en,c.name.hi)}{locked?M("  (always)","  (हमेशा)"):""}</span>
                    <span className="cmp-tick">{on?"✓":"+"}</span>
                  </button>
                );
              })}
            </div>
            <button className="chip cta" onClick={runCompare}>{M("Compare now","अभी compare करें")} · {cmpSel.length}/3</button>
          </div>
        )}

        {stage==="hub" && (
          <div className="chips">
            <button className="chip" onClick={compareCountries}>{M("Compare countries","देशों की तुलना")}</button>
            <button className="chip" onClick={whichPays}>{M("Which pays best?","कौन ज़्यादा pay करता है?")}</button>
            <button className="chip" onClick={visaDocs}>{M("Visa & documents","Visa & documents")}</button>
            <button className="chip" onClick={costGoing}>{M("Cost of going","जाने का खर्च")}</button>
            <button className="chip cta" onClick={()=>gpush(false)}>{M("Explore Germany 🇩🇪","Germany explore करें 🇩🇪")}</button>
          </div>
        )}

        {stage==="nudge" && (
          <div className="opts">
            <button className="opt" onClick={()=>{ me(M("Yes, tell me more","हाँ, और बताइए")); setStage(lead.gpushed ? "ghub" : "hub"); }}>{M("Yes, tell me more","हाँ, और बताइए")}</button>
            <button className="opt" onClick={()=>{ me(M("Book my free call","मेरी free call book करें")); askSlot(); }}>{M("Book my free call 📞","मेरी free call book करें 📞")}</button>
          </div>
        )}

        {stage==="gpush" && (
          <div className="opts">
            <button className="opt" onClick={()=>pickGpush(true)}>{M("Yes, tell me","हाँ, बताइए")}</button>
            <button className="opt" onClick={()=>pickGpush(false)}>{M("Maybe later","शायद बाद में")}</button>
          </div>
        )}

        {stage==="ghub" && (
          <div className="chips">
            <button className="chip" onClick={()=>answerChip("salary",M("Salary","सैलरी"))}>{M("Salary","सैलरी")}</button>
            <button className="chip" onClick={()=>answerChip("german",M("German language","German language"))}>{M("German language","German language")}</button>
            <button className="chip" onClick={()=>answerChip("visa",M("Visa & docs","Visa & documents"))}>{M("Visa & docs","Visa & documents")}</button>
            <button className="chip" onClick={()=>answerChip("pr",M("PR & family","PR & family"))}>{M("PR & family","PR & family")}</button>
            <button className="chip" onClick={()=>answerChip("cost",M("Cost & EMI","Fees & EMI"))}>{M("Cost & EMI","Fees & EMI")}</button>
            <button className="chip cta" onClick={offerVideo}>{M("Watch a short video 🎬","छोटा video देखें 🎬")}</button>
          </div>
        )}

        {stage==="video_lang" && (
          <div className="chips">
            {(lead.lang==="hi" ? ["Hindi","English"] : ["English","Hindi"]).map((L)=>
              <button key={L} className="chip cta" onClick={()=>playVideoLang(L)}>▶ {L==="Hindi" ? "हिंदी" : "English"}</button>)}
            <button className="chip" onClick={skipVideo}>{M("Just tell me in short","बस छोटे में बता दीजिए")}</button>
          </div>
        )}

        {stage==="video_feedback" && (
          <div className="chips">
            <button className="chip" onClick={()=>vidFeedback("good")}>{M("Loved it!","बहुत अच्छा लगा!")}</button>
            <button className="chip" onClick={()=>vidFeedback("confused")}>{M("Didn't fully get it","पूरा समझ नहीं आया")}</button>
            <button className="chip cta" onClick={()=>vidFeedback("more")}>{M("Yes, tell me more","हाँ, और बताइए")}</button>
          </div>
        )}

        {stage==="slot" && (
          <div className="chips">
            {SLOTS.map((o)=>
              <button key={o} className="chip" onClick={()=>{ me(o); finish(o); }}>{o}</button>)}
          </div>
        )}
        <div ref={endRef} />
      </div>

      <div className="dock">

        {showInput && (
          <div className="inbar">
            {stage==="phone" && <span className="pfx">+91</span>}
            <input ref={inRef} value={input} onChange={(e)=>setInput(e.target.value)} onKeyDown={onKey}
              inputMode={stage==="phone" ? "tel" : "text"} maxLength={stage==="phone" ? 18 : 90}
              placeholder={placeholder} />
            <button className="send" onClick={sendClick} aria-label="Send" disabled={!input.trim()}>➤</button>
          </div>
        )}


        {stage==="done" && (
          <div className="privacy">🔒 {M("No spam","कोई स्पैम नहीं")} · 🚫 {M("No unwanted calls","कोई अनचाही कॉल नहीं")} · ✅ {M("100% free","100% फ्री")} · {M("Your details stay private and are never sold.","आपकी जानकारी निजी रहती है, कभी नहीं बेची जाती।")}</div>
        )}
        {stage==="greet" && <div className="privacy">…</div>}
      </div>

      {showVideo && (
        <div className="vmodal" onClick={closeVideo}>
          <div className="vbox" onClick={(e)=>e.stopPropagation()}>
            <button className="vclose" onClick={closeVideo} aria-label="Close">✕</button>
            <div className="vframe">
              <div id="yt-player"></div>
              <div className="vmask"></div>
              <div className="vclick" onClick={togglePlay}>
                {!videoPlaying && !videoEnded && <div className="vplay">▶</div>}
              </div>
              <div className="vctrl" onClick={(e)=>e.stopPropagation()}>
                <button className="vbtn" onClick={togglePlay} aria-label="Play/Pause">{videoPlaying ? "❚❚" : "▶"}</button>
                <div className="vprog" onClick={seekTo}><div className="vprog-fill" style={{ width:(videoProg*100)+"%" }}></div></div>
                <button className="vbtn" onClick={toggleMute} aria-label="Mute">{videoMuted ? "🔇" : "🔊"}</button>
              </div>
              {videoEnded && (
                <div className="vend">
                  <button className="chip cta" onClick={togglePlay}>↻ Watch again</button>
                  <button className="chip" onClick={closeVideo}>Done ✓</button>
                </div>
              )}
            </div>
            <div className="vcap">How the Germany nursing pathway works · {videoLang}</div>
          </div>
        </div>
      )}

      {CONFIG.DEMO_MODE && (
        <React.Fragment>
          <button className="demo-toggle" onClick={()=>setShowData((s)=>!s)}>
            {showData ? "▾ Hide" : "▸ Show"} what flows to CRM v2 (demo)
          </button>
          {showData && (
            <pre className="demo">{JSON.stringify({
              table:"v2_staging", status:"pending", source:"offline",
              name:lead.name||null, phone:lead.phone||null,
              phone_valid: lead.phoneValid===undefined ? null : lead.phoneValid,
              phone_flag: lead.phoneFlag||null,
              source_detail:{
                channel:"norcet_exit", funnel:"germany_nursing", exam_center:CONFIG.EXAM_CENTER,
                qualification:lead.qualification||null, city:lead.city||null, preferred_language:lead.language||null,
                preferred_time:lead.slot||null, chat_query:lead.question||null, captured_at:lead.capturedAt||null,
                activity: activityOf(lead, lead.lastStage),
              },
            }, null, 2)}</pre>
          )}
        </React.Fragment>
      )}
      </React.Fragment>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
